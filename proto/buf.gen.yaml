version: v2
# Generation config for the agent proto. Run `buf generate` from the proto/ dir.
# Output lands at proto/gen/go/agent/v1/*.pb.go (paths=source_relative).
#
# Local plugins (install matching versions to reproduce the committed output):
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
