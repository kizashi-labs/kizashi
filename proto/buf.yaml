version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Existing API predates buf lint; enforce STANDARD on new protos without
    # churning the established package/enum/RPC naming.
    - PACKAGE_VERSION_SUFFIX
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
