    PlanRequiredError:
      type: object
      description: |
        `RequireFeature` ミドルウェアが返す 402 エラー (`server/internal/middleware/plan_gate.go`)。
        現在のライセンスが必要な機能を含まない場合に返される。
      required: [error, feature, required_plan, upgrade_message]
      properties:
        error:
          type: string
          enum: [plan_required]
        feature:
          type: string
          description: |
            アクセスを試みた機能の名前 (`server/internal/license/manager.go` の `Feature*` 定数)。
          enum:
            - basic_detection
            - alerts
            - reports
            - mdm
            - ai_investigation
            - siem_integration
            - playbooks
            - threat_intel
            - yara
            - ml_detection
            - threat_hunting
            - multi_tenant
            - compliance
            - api_access
            - xdr
            - deception
            - forensics
            - soar
        required_plan:
          type: string
          description: |
            この機能を解除する最小プラン。`requiredPlanFor` ヘルパーが返す値で、
            v1.3.3 で MDM 機能は `enterprise` から `starter` に修正済み。
            `lite` は他機能を持たない (Lite が含む機能は 200 を返すため `required_plan` は出現しない)。
          enum: [starter, professional, enterprise]
        upgrade_message:
          type: string
          example: この機能はStarterプラン（¥1,000/端末/月）以上で利用できます

    AgentLimitReachedError:
      type: object
      description: |
        `EnforceAgentLimit` ミドルウェアが返す 402 エラー (`server/internal/middleware/plan_gate.go`)。
        プランの `agent_limit` に達した状態でエージェント追加を試みると返される。
        Lite プランでは Stripe Subscription Quantity が `agent_limit` になる
        (例: 10 EP 契約のテナントは 10 台で上限)。
      required: [error, agent_limit, agents_active, plan, upgrade_message]
      properties:
        error:
          type: string
          enum: [agent_limit_reached]
        agent_limit:
          type: integer
          description: 現プランのエージェント上限 (0=無制限)
          example: 10
        agents_active:
          type: integer
          description: 現在アクティブなエージェント数
          example: 10
        plan:
          type: string
          enum: [free, lite, starter, professional, enterprise]
        upgrade_message:
          type: string
          example: エージェント数がプランの上限に達しています。プランをアップグレードしてください。

