          in: query
          schema: { type: string, enum: [sigma, yara, all] }
        - name: format
          in: query
          schema: { type: string, enum: [json, zip], default: json }
      responses:
        "200":
          description: エクスポートデータ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRule"

  # ── Geolocation ───────────────────────────────────────────────────
  /api/v1/geo/lookup:
    post:
      operationId: lookupGeo
      tags: [threat-intel]
      summary: IPアドレスのジオロケーション情報取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip: { type: string, format: ipv4 }
      responses:
        "200":
          description: ジオロケーション情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip: { type: string }
                  country: { type: string }
                  country_code: { type: string }
                  city: { type: string }
                  latitude: { type: number }
                  longitude: { type: number }
                  is_vpn: { type: boolean }
                  is_tor: { type: boolean }
                  threat_score: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/admin/system-updates:
    get:
      tags: [Admin - System Updates]
      summary: Auto-update履歴一覧
      description: |
        検知済みのプラットフォームアップデート一覧を新しい順で返す。
        Phase 1: rows はテストフィクスチャか手動 SQL で挿入される。
      operationId: listSystemUpdates
      responses:
        "200":
          description: 更新履歴
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SystemUpdate" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/system-updates/current:
    get:
      tags: [Admin - System Updates]
      summary: 現在版 + 最新利用可能版
      operationId: getCurrentSystemUpdate
      responses:
        "200":
          description: 現在のバージョンと最新候補
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version:
                    type: string
                    example: "1.0.0"
                  latest_available:
                    oneOf:
                      - $ref: "#/components/schemas/SystemUpdate"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/system-updates/check:
    post:
      tags: [Admin - System Updates]
      summary: 即時 Releases チェック
      description: |
        GitHub Releases API を同期呼び出しして、新しいバージョンを検出した場合は
        `system_updates` テーブルに INSERT した上で `update_available` を返す。

        - `up_to_date`: 現在の `Version` が最新
        - `update_available`: 新版検出 (latest_available に詳細)
        - `check_failed`: GitHub API 呼び出し失敗 (error フィールドに詳細)

        Phase 1 では常に `up_to_date` を返すスタブ。Phase 2 で実装。
      operationId: checkSystemUpdates
      responses:
        "200":
          description: チェック結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked_at:
                    type: string
                    format: date-time
                  result:
                    type: string
                    enum: [up_to_date, update_available, check_failed]
                  error:
                    type: string
                    description: result=check_failed 時のエラー詳細
                  latest_available:
                    oneOf:
                      - $ref: "#/components/schemas/SystemUpdate"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/system-updates/{id}/approve:
    post:
      tags: [Admin - System Updates]
      summary: アップデート適用承認
      description: |
        status を `available` → `approved` に遷移させる。
        Phase 1: DB 行の更新のみ、実際の適用は Phase 3 で実装。
      operationId: approveSystemUpdate
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 更新後の行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 現在ステータスが `available` ではない、または id が存在しない

  /api/v1/admin/system-updates/{id}/cancel:
    post:
      tags: [Admin - System Updates]
      summary: 承認取消
      description: status を `approved` → `available` に戻す。
      operationId: cancelSystemUpdate
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 更新後の行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 現在ステータスが `approved` ではない、または id が存在しない

  /api/v1/admin/system-updates/settings:
    get:
      tags: [Admin - System Updates]
      summary: 自動適用設定取得
      operationId: getSystemUpdateSettings
      responses:
        "200":
          description: 設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdateSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Admin - System Updates]
      summary: 自動適用設定更新
      operationId: updateSystemUpdateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemUpdateSettingsInput" }
      responses:
        "200":
          description: 更新後の設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdateSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: リクエストが不正です
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認証が必要です
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: アクセス権限がありません
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: レート制限を超過しました
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: |
        現在のライセンスプランで利用可能な機能・上限を超えています。
        レスポンスボディの `error` フィールドで原因を判別:
        - `plan_required`: 機能ゲート (例: MDM を Lite テナントが叩いた) — `feature` / `required_plan` / `upgrade_message` を含む
        - `agent_limit_reached`: エージェント上限超過 — `agent_limit` / `agents_active` / `plan` を含む
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/PlanRequiredError"
              - $ref: "#/components/schemas/AgentLimitReachedError"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: エラーメッセージ

    PlanRequiredError:
      type: object
      description: |
        `RequireFeature` ミドルウェアが返す 402 エラー (`server/internal/middleware/plan_gate.go`)。
        現在のライセンスが必要な機能を含まない場合に返される。
      required: [error, feature, required_plan, upgrade_message]
      properties:
        error:
          type: string
          enum: [plan_required]
        feature:
          type: string
          description: |
            アクセスを試みた機能の名前 (`server/internal/license/manager.go` の `Feature*` 定数)。
          enum:
            - basic_detection
            - alerts
            - reports
            - mdm
            - ai_investigation
            - siem_integration
            - playbooks
            - threat_intel
            - yara
            - ml_detection
            - threat_hunting
            - multi_tenant
            - compliance
            - api_access
            - xdr
            - deception
            - forensics
            - soar
        required_plan:
          type: string
          description: |
            この機能を解除する最小プラン。`requiredPlanFor` ヘルパーが返す値で、
            v1.3.3 で MDM 機能は `enterprise` から `starter` に修正済み。
            `lite` は他機能を持たない (Lite が含む機能は 200 を返すため `required_plan` は出現しない)。
          enum: [starter, professional, enterprise]
        upgrade_message:
          type: string
          example: この機能はStarterプラン（¥1,800/端末/月）以上で利用できます

    AgentLimitReachedError:
      type: object
      description: |
        `EnforceAgentLimit` ミドルウェアが返す 402 エラー (`server/internal/middleware/plan_gate.go`)。
        プランの `agent_limit` に達した状態でエージェント追加を試みると返される。
        Lite プランでは Stripe Subscription Quantity が `agent_limit` になる
        (例: 10 EP 契約のテナントは 10 台で上限)。
      required: [error, agent_limit, agents_active, plan, upgrade_message]
      properties:
        error:
          type: string
          enum: [agent_limit_reached]
        agent_limit:
          type: integer
          description: 現プランのエージェント上限 (0=無制限)
          example: 10
        agents_active:
          type: integer
          description: 現在アクティブなエージェント数
          example: 10
        plan:
          type: string
          enum: [free, lite, starter, professional, enterprise]
        upgrade_message:
          type: string
          example: エージェント数がプランの上限に達しています。プランをアップグレードしてください。

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, analyst, viewer]
        is_active:
          type: boolean
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        os_type:
          type: string
          enum: [windows, linux, darwin, unknown]
        os_version:
          type: string
        agent_version:
          type: string
        ip_addresses:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [online, offline, isolated, error, inactive]
          description: >-
            inactive = 30日以上ハートビートが無く DeadAgentCleanup が退役判定した状態。
            エージェントが再びハートビートを送れば online に戻る（isolated だけは保護される）。
        last_seen:
          type: string
          format: date-time
          description: 値が無い場合はレスポンスから省略されます。
        enrolled_at:
          type: string
          format: date-time
        group_id:
          type: string
          format: uuid
          nullable: true
        policy_id:
          type: string
          format: uuid
          nullable: true
        config_version:
          type: integer
        tls_thumbprint:
          type: string
          nullable: true
        isolated_at:
          type: string
          format: date-time
          nullable: true
        isolated_reason:
          type: string
          nullable: true
        isolated_by:
          type: string
          nullable: true
          description: "'ai_agent' | 'auto_rule' | ユーザーID"
        tags:
          type: array
          items:
            type: string

    Alert:
