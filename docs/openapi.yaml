      summary: 通知チャンネル設定一覧
      responses:
        "200":
          description: チャンネル設定一覧
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createNotificationChannel
      tags: [settings]
      summary: 通知チャンネル追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, config]
              properties:
