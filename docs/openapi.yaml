        plan:
          type: string
          enum: [lite, starter, professional, enterprise]
          description: |
            Subscription tier. `lite` is the SMB entry tier added 2026-04-23
            (5–45 endpoints in 5-EP increments at ¥500/EP/month, basic
            detection + alerts + reports, no MDM). See docs/pricing.md.
