components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Undocumented:
      description: |
        自動生成の操作。実装は存在しますが、応答の形状は未記載です。
        ここを埋めるときは、その操作を手書きセクションへ移してください。
    RateLimited:
      description: リクエスト数制限超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: リクエストが不正です
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認証が必要です
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: アクセス権限がありません
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: レート制限を超過しました
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: |
        現在のライセンスプランで利用可能な機能・上限を超えています。
        レスポンスボディの `error` フィールドで原因を判別:
        - `plan_required`: 機能ゲート (例: MDM を Lite テナントが叩いた) — `feature` / `required_plan` / `upgrade_message` を含む
        - `agent_limit_reached`: エージェント上限超過 — `agent_limit` / `agents_active` / `plan` を含む
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/PlanRequiredError"
              - $ref: "#/components/schemas/AgentLimitReachedError"

  schemas:
    SuppressionConditions:
      type: object
      description: |
        抑制条件。書かれた条件すべてに一致したアラートだけを抑制する (AND)。
        一致の仕方は条件ごとに違う (`server/internal/detection/suppression_matcher.go`)。

        条件がひとつも無いルール、および書かれた条件が全て「絞り込みにならない」
        ルール (`severity_max: 10`、`mitre_technique: "T"` など) は catch-all として
        **検知エンジンが適用を拒む** (`ClassifySuppression`)。保存自体は成功するので、
        API 利用者は条件を1つ以上指定すること。

        更新 (PUT) では conditions は列ごと置き換わる。編集後の条件を丸ごと送ること。
      properties:
        rule_name:
          type: string
          description: 検知ルール名の部分一致 (大文字小文字を区別しない)
        hostname:
          type: string
          description: ホスト名の部分一致 (大文字小文字を区別しない)
        agent_id:
          type: string
          description: エージェントIDの完全一致
        mitre_technique:
          type: string
          description: MITRE 技法の前方一致 (T1059 は T1059.001 にも当たる)
        severity_max:
          type: integer
          minimum: 1
          maximum: 10
          description: この値以下の重大度だけを抑制。10 は上限そのもので何も絞れない
        command_line_contains:
          type: string
          description: コマンドラインの部分一致。8文字未満は絞り込みとみなされない
        parent_process:
          type: string
          description: 親プロセス画像パスの後方一致

