openapi: "3.0.3"
info:
  title: Kizashi API
  version: "1.0.0"
  description: |
    Kizashi REST API — エンドポイント検知・対応プラットフォーム

    ## この仕様の読み方
    操作は 2 種類あります。

    - **手書き** — 要求/応答の形状まで記載され、CI で実装との一致を検証しています
    - **`x-generated: true`** — router.go から自動生成。パス・メソッド・認証要否・
      パスパラメータが実装と一致することだけを保証します。要求/応答の形状は
      未記載です（書けないものを書かないための意図的な空白です）

    再生成は `cd server && go run ./cmd/openapi-sync`。CI は `-check` で
    実装との差分を落とします。

    ## 認証
    すべての保護されたエンドポイントは `Authorization: Bearer <JWT>` ヘッダーが必要です。
    `/api/v1/auth/login` でJWTトークンを取得してください。

    ## レート制限
    - 認証済みリクエスト: 1000 req/分
    - 認証エンドポイント: 10 req/分
  contact:
    name: Kizashi
    url: https://github.com/kizashi-labs/kizashi/issues
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:8080
    description: 開発サーバー
  - url: https://api.kizashi-edr.example.com
    description: 本番サーバー

security:
  - BearerAuth: []

tags:
  - name: auth
    description: 認証・認可
  - name: agents
    description: エンドポイントエージェント管理
  - name: alerts
    description: セキュリティアラート
  - name: incidents
    description: インシデント管理
  - name: rules
    description: 検知ルール
  - name: users
    description: ユーザー管理
  - name: invitations
    description: ユーザー招待
  - name: support
    description: サポートチケット
  - name: billing
    description: 課金・サブスクリプション
  - name: compliance
    description: コンプライアンス
  - name: threat-intel
    description: 脅威インテリジェンス
  - name: reports
    description: レポート生成
  - name: settings
    description: システム設定
  - name: system
    description: システム情報・ヘルスチェック
  - name: users
    description: ユーザー管理
  - name: API Keys
    description: APIキー管理
  - name: Live Response
    description: ライブレスポンス
  - name: Vulnerabilities
    description: 脆弱性管理
  - name: Enrollment
    description: エージェント登録
  - name: DLP
    description: データ損失防止

paths:
  # ── Auth ────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT アクセストークン
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: ログアウト
      responses:
        "200":
          description: ログアウト成功
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: アクセストークン更新
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: リフレッシュトークン
      responses:
        "200":
          description: 新しいアクセストークン
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWTアクセストークン
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: パスワードリセットリクエスト
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: メールを送信しました（メール存在有無に関わらず200）
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: パスワードリセット確認
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: パスワードを変更しました
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Agents ─────────────────────────────────────────────────────
  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: エージェント一覧取得
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, isolated, error, inactive]
        - name: os
          in: query
          description: os_type の完全一致
          schema:
            type: string
            enum: [windows, linux, darwin, unknown]
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: ホスト名・IPアドレスの部分一致
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 1〜1000。範囲外は 20 にフォールバックする。別名 limit も可
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: エージェント一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  has_more:
                    type: boolean
  /api/v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: エージェント詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: エージェント詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [agents]
      summary: PUT /api/v1/agents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: putAgentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    patch:
      tags: [agents]
      summary: PATCH /api/v1/agents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: patchAgentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    delete:
      tags: [agents]
      summary: DELETE /api/v1/agents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: deleteAgentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
  /api/v1/agents/{id}/isolate:
    post:
      operationId: isolateAgent
      tags: [agents]
      summary: エージェントのネットワーク隔離
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 隔離コマンドを送信しました
  /api/v1/agents/{id}/unisolate:
    post:
      operationId: unisolateAgent
      tags: [agents]
      summary: エージェントの隔離解除
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 隔離解除コマンドを送信しました
  /api/v1/agents/{id}/effective-config:
    get:
      operationId: getAgentEffectiveConfig
      tags: [agents]
      summary: エージェントの実効設定取得（ポリシー + エージェント個別設定のマージ結果）
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 実効設定マップ
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  effective:
                    type: object
                    additionalProperties: true
                    description: キー→値の設定マップ（スキーマ定義による）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/agent-config/schema:
    get:
      operationId: getAgentConfigSchema
      tags: [agents]
      summary: エージェント設定スキーマ取得（有効なキー・型・デフォルト値・制約の一覧）
      responses:
        "200":
          description: 設定スキーマ
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        type:
                          type: string
                        default:
                          description: デフォルト値
                        min:
                          type: integer
                        max:
                          type: integer
                        enum:
                          type: array
                          items:
                            type: string
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Alerts ─────────────────────────────────────────────────────
  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: アラート一覧取得
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low, info]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved, false_positive]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: アラート一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  total:
                    type: integer
  /api/v1/alerts/{id}:
    get:
      operationId: getAlert
      tags: [alerts]
      summary: アラート詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: アラート詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
    put:
      tags: [alerts]
      summary: PUT /api/v1/alerts/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: putAlertsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }

  # ── System ─────────────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: システム状態
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: ok
                  version:
                    type: string
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: ユーザー一覧取得
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
        - name: role
          in: query
          schema: { type: string, enum: [admin, analyst, viewer, operator] }
      responses:
        "200":
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [users]
      summary: ユーザー作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 12
                role:
                  type: string
                  enum: [admin, analyst, viewer, operator]
                name:
                  type: string
      responses:
        "201":
          description: ユーザー作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: ユーザー更新
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role:
                  type: string
                  enum: [admin, analyst, viewer, operator]
                is_active: { type: boolean }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: ユーザー削除
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 削除成功
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/password:
    put:
      operationId: changePassword
      tags: [users]
      summary: パスワード変更
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "200":
          description: 変更成功
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Alerts (extended) ────────────────────────────────────────────
  /api/v1/alerts/{id}/status:
    post:
      operationId: updateAlertStatus
      tags: [alerts]
      summary: アラートステータス変更
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, investigating, resolved, false_positive, suppressed]
      responses:
        "200":
          description: 更新成功
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/alerts/{id}/comments:
    get:
      operationId: listAlertComments
      tags: [alerts]
      summary: アラートコメント一覧
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: コメント一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
    post:
      operationId: addAlertComment
      tags: [alerts]
      summary: アラートコメント追加
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "201":
          description: コメント追加成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/alerts/export:
    get:
      operationId: exportAlerts
      tags: [alerts]
      summary: アラートエクスポート
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json, pdf] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: エクスポートファイル
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Enrollment ────────────────────────────────────────────────────
  /api/v1/enrollment/request:
    post:
      operationId: requestEnrollment
      tags: [Enrollment]
      summary: エージェント登録リクエスト
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, os, agent_version]
              properties:
                hostname: { type: string }
                os: { type: string, enum: [windows, linux, macos] }
                agent_version: { type: string }
                enrollment_token: { type: string }
      responses:
        "200":
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    format: uuid
                  config_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/enrollment/requests:
    get:
      operationId: listEnrollmentRequests
      tags: [Enrollment]
      summary: 登録リクエスト一覧（管理者）
      responses:
        "200":
          description: 登録リクエスト一覧
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/enrollment/requests/{id}/approve:
    post:
      operationId: approveEnrollmentRequest
      tags: [Enrollment]
      summary: 登録リクエスト承認
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 承認成功
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Notifications ─────────────────────────────────────────────────
  /api/v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [system]
      summary: ダッシュボードサマリー
      responses:
        "200":
          description: ダッシュボードサマリー
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_agents: { type: integer }
                  open_alerts: { type: integer }
                  open_incidents: { type: integer }
                  critical_vulnerabilities: { type: integer }
                  threat_score: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/mfa/verify:
    post:
      operationId: postAuthMfaVerify
      tags: [auth]
      summary: MFA検証
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token:
                  type: string
                  description: pre_auth_token
                code:
                  type: string
                  description: TOTPコード (6桁)
      responses:
        '200':
          description: MFA検証成功、フルJWT返却

  # ── Agents ────────────────────────────────────────────────────
  /api/v1/alerts/stats:
    get:
      operationId: getAlertsStats
      tags: [alerts]
      summary: アラート統計
      responses:
        '200':
          description: 統計情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  open:
                    type: integer
                  critical:
                    type: integer
                  high:
                    type: integer
                  investigating:
                    type: integer

  # ── Users ──────────────────────────────────────────────────────
  /api/v1/alerts/{id}/enrich:
    post:
      operationId: postAlertsIdEnrich
      tags: [alerts]
      summary: VTエンリッチメント実行
      description: アラートのIPアドレス/ハッシュをVirusTotalで非同期検索します。
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '202':
          description: エンリッチメントリクエスト受付
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: pending
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/docs:
    get:
