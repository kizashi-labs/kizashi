                  type: string
                  enum: [slack, teams, email, webhook, pagerduty]
                name: { type: string }
                config:
                  type: object
                  description: チャンネル固有の設定
      responses:
        "201": { description: 作成成功 }
        "400": { $ref: "#/components/responses/BadRequest" }

