name: Coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write      # Needed to commit badge JSON to the repo
  pull-requests: write # Needed to post PR comments

# 打ち切ってよい。contents: write は付いているが、実際にはバッジ JSON を
# badges/coverage.json として artifact に上げるだけで、リポジトリへの
# commit は行っていない（上のコメントは実装と食い違っている）。PR コメント
# は後続の実行が新しい数値で投稿し直すので、途中で切って困らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Go Coverage Report
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: edrplatform_test
          POSTGRES_USER: edr
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edr -d edrplatform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
        options: >-
          --health-cmd "nc -z localhost 4222 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history so we can commit the badge update back to main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run migrations
        working-directory: server
        env:
          DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
        run: |
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f" 2>/dev/null || true
          done

      - name: Run tests with coverage
        id: run_tests
        working-directory: server
        env:
          DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
          # TEST_DATABASE_URL activates the DB-backed handler integration tests
          # (otherwise they t.Skip), so the reported badge matches the ci.yml
          # gate (~11.7%) instead of the integration-skipped (~8%) number.
          TEST_DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
          NATS_URL: nats://localhost:4222
        run: |
          go test -race -timeout 120s \
            -coverprofile=coverage.out -covermode=atomic \
            ./...

      # ── Per-package coverage breakdown ──────────────────────────
      - name: Generate per-package coverage table
        id: coverage_table
        working-directory: server
        run: |
          go tool cover -func=coverage.out > coverage_func.txt
          cat coverage_func.txt

          # Extract the total line and compute the percentage value
          TOTAL_LINE=$(grep '^total:' coverage_func.txt)
          COVERAGE_PCT=$(echo "$TOTAL_LINE" | awk '{print $3}' | tr -d '%')
          echo "coverage_pct=${COVERAGE_PCT}" >> "$GITHUB_OUTPUT"
          echo "total_line=${TOTAL_LINE}" >> "$GITHUB_OUTPUT"

          # The *enforced* gate lives in ci.yml's server-test job, not here —
          # this workflow only reports. The PR comment below used to hardcode
          # its own "Threshold: 40%" and therefore rendered "❌ Fail" on PRs
          # that were actually passing the real gate (35%), which repeatedly
          # read as a CI failure during review. Read the real value out of
          # ci.yml so the two can never drift again.
          #
          # Scoped to the server-test job block on purpose: agent-test has its
          # own "Check coverage threshold (30%)" step, and a plain grep+head -1
          # would silently report that one instead if the jobs were ever
          # reordered — the same class of quietly-wrong number this fixes.
          GATE=$(awk '/^  server-test:/{f=1}
                      f && /^  [a-z][a-z0-9-]*:[[:space:]]*$/ && !/^  server-test:/{f=0}
                      f' ../.github/workflows/ci.yml \
            | grep -oE 'Check coverage threshold \(([0-9]+)%\)' | grep -oE '[0-9]+' | head -1)
          if [ -z "$GATE" ]; then
            echo "::warning::Could not parse the coverage gate from ci.yml; reporting without a pass/fail verdict."
          fi
          echo "gate_pct=${GATE}" >> "$GITHUB_OUTPUT"

      # ── HTML report ─────────────────────────────────────────────
      - name: Generate HTML coverage report
        working-directory: server
        run: go tool cover -html=coverage.out -o coverage.html

      # ── shields.io compatible badge JSON ────────────────────────
      - name: Generate coverage badge JSON
        id: badge
        working-directory: server
        run: |
          PCT="${{ steps.coverage_table.outputs.coverage_pct }}"
          echo "Coverage: ${PCT}%"

          # Choose badge colour based on percentage
          if awk "BEGIN { exit !($PCT >= 80) }"; then
            COLOR="brightgreen"
          elif awk "BEGIN { exit !($PCT >= 60) }"; then
            COLOR="green"
          elif awk "BEGIN { exit !($PCT >= 40) }"; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          mkdir -p ../badges
          cat > ../badges/coverage.json << EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${PCT}%",
            "color": "${COLOR}"
          }
          EOF
          echo "badge_color=${COLOR}" >> "$GITHUB_OUTPUT"

      # ── Upload artifacts ─────────────────────────────────────────
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            server/coverage.out
            server/coverage.html
            server/coverage_func.txt
            badges/coverage.json
          retention-days: 30

      # ── Upload to Codecov ────────────────────────────────────────
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: server/coverage.out
          flags: server
          name: server-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pct    = '${{ steps.coverage_table.outputs.coverage_pct }}';
            const gate   = '${{ steps.coverage_table.outputs.gate_pct }}';
            const color  = '${{ steps.badge.outputs.badge_color }}';
            const sha    = context.payload.pull_request.head.sha.slice(0, 7);

            const colorEmoji = {
              brightgreen: '🟢',
              green:       '🟢',
              yellow:      '🟡',
              red:         '🔴',
            }[color] || '⚪';

            // `gate` is parsed from ci.yml (the workflow that actually enforces
            // the threshold); this workflow only reports. If parsing failed we
            // omit the verdict rather than inventing one — a wrong "❌ Fail"
            // here reads as a broken build on an otherwise-green PR.
            const passes = gate !== '' && parseFloat(pct) >= parseFloat(gate);

            const rows = [
              `| **Total coverage** | \`${pct}%\` |`,
            ];
            if (gate !== '') {
              rows.push(`| **Gate (enforced in \`ci.yml\`)** | \`${gate}%\` |`);
              rows.push(`| **Status** | ${passes ? '✅ Pass' : '❌ Fail'} |`);
            }

            const body = [
              `## ${colorEmoji} Coverage Report — \`${sha}\``,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              ...rows,
              '',
              '> Full HTML report is available as a workflow artifact.',
              '> This job reports coverage; the build-blocking gate is the',
              '> `Check coverage threshold` step in `ci.yml`.',
            ].join('\n');

            // Find and update an existing bot comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
