name: CI

on:
  push:
    branches: [main, develop]
    # Docs/markdown-only changes don't affect builds or deploys, so skip CI
    # (and the downstream docker.yml deploy, which is workflow_run-triggered).
    # A mixed PR (code + docs) still runs CI because path filters only skip when
    # ALL changed files match.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go: server ────────────────────────────────────────────────
  # ── 変更のあった領域を判定する ──────────────────────────────
  # PR ごとに 18 ジョブ全部を回すと、サーバだけの変更でもエージェントの
  # 6 ターゲット・クロスビルドや Trivy のイメージスキャンが走る。実測で
  # 1 PR あたり 40 分超を消費し、Actions の予算を 2 度使い切った。
  #
  # 第三者製のフィルタ・アクションは使わず git で判定する。セキュリティ製品の
  # CI に外部アクションを増やしたくないため。判定できない場合は必ず「全部走らせる」
  # に倒す（取りこぼして緑になるより、余分に回すほうがまし）。
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      agent:    ${{ steps.filter.outputs.agent }}
      server:   ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sdk:      ${{ steps.filter.outputs.sdk }}
      rules:    ${{ steps.filter.outputs.rules }}
      all:      ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # main への push は絞らない。
          #
          # PR で絞るのはコスト削減として妥当だが、main まで絞ると **一度赤くなった
          # ジョブは、その領域を触る PR が来るまで二度と走らない**。チェック一覧の
          # 上では「走って通った」と「そもそも走っていない」の区別が付かないため、
          # 赤が無期限に隠れる（実際に 8 日間隠れた）。マージ 1 回ぶんのコストで、
          # main の全ジョブに常に最新の結論が存在する状態を買う。
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "main への push のため、絞らず全ジョブを実行します"
            for k in agent server frontend sdk rules all; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          files=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            files="$(git diff --name-only "origin/$BASE_REF...HEAD" || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]                && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$SHA" || true)"
          fi

          # 差分が取れなかった (初回 push / force push / 履歴なし) ときは全部走らせる
          if [ -z "$files" ]; then
            echo "変更ファイルを特定できませんでした。全ジョブを実行します。"
            for k in agent server frontend sdk rules all; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          echo "変更ファイル:"; echo "$files" | sed 's/^/  /'

          has() { echo "$files" | grep -qE "$1"; }

          # CI 定義・proto・共通設定が変わったら全部走らせる。
          # proto は agent と server の両方が依存し、ズレると実行時にしか露見しない。
          all=false
          if has '^\.github/workflows/' || has '^proto/' || has '^docker-compose' || has '^Makefile'; then
            all=true
          fi

          agent=false;    has '^agent/'                      && agent=true
          # migrations は server のテストが実 DB に適用するので server 側に含める
          server=false;   has '^server/'                     && server=true
          frontend=false; has '^frontend/'                   && frontend=true
          sdk=false;      has '^sdk/'                        && sdk=true
          rules=false;    has '^rules/|^server/migrations/'  && rules=true

          {
            echo "agent=$agent"; echo "server=$server"; echo "frontend=$frontend"
            echo "sdk=$sdk"; echo "rules=$rules"; echo "all=$all"
          } >> "$GITHUB_OUTPUT"

          echo "判定: agent=$agent server=$server frontend=$frontend sdk=$sdk rules=$rules all=$all"

  server-test:
    name: Server Tests (Go)
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: edrplatform_test
          POSTGRES_USER: edr
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edr -d edrplatform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
        options: >-
          --health-cmd "nc -z localhost 4222 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          # golangci-lint の --new-from-merge-base に必要（origin/main との比較）。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run migrations
        working-directory: server
        env:
          DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
        run: |
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f" 2>/dev/null || true
          done

      # gofmt ゲート。未整形のまま入ったファイルが 337 件まで積み上がっていた
      # (この PR で一括整形)。CI に検出が無いのが原因なので、ここで塞ぐ。
      #
      # gofmt -l は未整形ファイルのパスを出すだけで終了コードは 0 のため、
      # 出力が空であることを test -z で確認する。差分そのものは -d で出す。
      - name: gofmt
        working-directory: server
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "以下のファイルが gofmt 未整形です:"
            gofmt -l .
            echo "--- 差分 ---"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      # docs/openapi.yaml が router.go に追従しているかを見る。
      # 手書き記述が実装に存在すること、自動生成分が最新であること、
      # API が配信する server/docs/openapi.yaml が正本と同一であることの3点。
      # 導入前は 1,459 操作中 119 しか載っておらず、載っていた 171 のうち
      # 52 が実装に存在しないパス/メソッドだった。
      - name: OpenAPI sync check
        working-directory: server
        run: go run ./cmd/openapi-sync -check

      # staticcheck はバージョンを固定する。@latest は「コードが変わっていないのに
      # CI が赤くなる」経路そのもので、golangci-lint 側で実際に起きた
      # (docs/ops/CI負債_調査と是正.md)。上げるときは意図的に上げる。
      - name: staticcheck
        working-directory: server
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      # golangci-lint: errcheck/gosec/bodyclose 等の厳選セットを追加（.golangci.yml）。
      # 既存バックログは段階導入のため、--new-from-merge-base で「新規・変更コードのみ」を
      # ゲートする（main push 時は差分なし）。全体スキャンはローカルで実施。
      #
      # 公式アクションを使う理由: `go install …@latest` は golangci-lint の依存を
      # その場でモジュール解決するため、リンタの依存が1つでも取得できなくなると
      # コード変更ゼロで CI が落ちる。2026-08-03 に実際に発生した:
      #
      #   unqueryvet.go:4:2: github.com/MirrexOne/unqueryvet@v1.5.4:
      #   reading https://proxy.golang.org/…/@v/v1.5.4.zip: 403 Forbidden
      #
      # アクションはビルド済みリリースバイナリを取得するので、リンタ側の依存解決が
      # そもそも起きない。この故障クラスが構造的に消える。version も固定する。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server
          args: --new-from-merge-base=origin/main ./...

      # NOTE: govulncheck はこのジョブには置かない。server-vulncheck ジョブを参照。

      - name: Unit tests (with coverage)
        working-directory: server
        env:
          DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
          # TEST_DATABASE_URL activates the DB-backed handler integration tests
          # (testPool in handlers_test.go) which otherwise t.Skip(). Points at the
          # same migrated postgres service so the integration suite actually runs.
          TEST_DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
          NATS_URL: nats://localhost:4222
        run: |
          go test -race -timeout 120s \
            -coverprofile=coverage.out -covermode=atomic \
            ./...

      # Synthetic-injection E2E: drives crafted events through the real
      # AlertPipeline → real Postgres INSERT path and asserts an alert row lands.
      # Tagged `integration` so it is excluded from the unit step above; it needs
      # the migrated postgres service (DATABASE_URL). Guards the "silent break"
      # class (inert rule / failed INSERT) that pure-logic tests cannot see.
      - name: Synthetic injection E2E (integration)
        working-directory: server
        env:
          DATABASE_URL: postgres://edr:testpassword@localhost:5432/edrplatform_test
          NATS_URL: nats://localhost:4222
        run: |
          go test -tags integration -race -timeout 120s \
            ./internal/detection/...

      - name: Check coverage threshold (35%)
        working-directory: server
        # 公開版のカバレッジゲート。
        # 商用版のゲート (45%) は、全ハンドラを登録するルータテストを含めて
        # 測った値で、そのテストは公開版に含まれないため到達できない。
        # ここでは「大きな後退だけを捕まえる床」を置いている。
        # 2026-08-12: 実測 35.9%（ci.yml と coverage.yml の独立した 2 経路で一致）。
        # 本流と同じ流儀で実測の約 1pp 下に置く: 34% → 35% にラチェット。
        # 上げるときは、直近のグリーン実行の `Total coverage` を見てから。
        # 段階: 15% → 34% → 35%。
        run: |
          COVERAGE=$(go tool cover -func=coverage.out \
            | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          # Use awk for float comparison (bash cannot compare floats natively)
          if awk "BEGIN { exit !($COVERAGE < 35) }"; then
            echo "ERROR: Coverage ${COVERAGE}% is below the 35% threshold."
            exit 1
          fi
          echo "Coverage check passed: ${COVERAGE}% >= 35%"

      - name: Generate HTML coverage report
        working-directory: server
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: |
            server/coverage.out
            server/coverage.html
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true   # Non-blocking if token not configured
        with:
          files: server/coverage.out
          flags: server
          name: server-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build all services
        working-directory: server
        run: |
          go build ./cmd/api/...
          go build ./cmd/ingestion/...
          go build ./cmd/detection/...

  # ── Detection rule validation ────────────────────────────────
  # rules/ (Sigma YAML under rules/sigma/**, YARA under rules/yara/**) had no
  # CI validation at all — a malformed rule would just silently fail to load
  # in production with no build-time signal. This job reuses the server's
  # real Sigma parser/compiler (server/internal/detection.SigmaEvaluator,
  # the same code path used to load rules at runtime) and the real `yara`
  # CLI (reference implementation) to catch syntax errors before they ship.
  # See server/cmd/validate-rules for the validator and why YARA validation
  # shells out to the `yara` CLI rather than reusing the agent's hand-rolled
  # parser (agent/internal/scanner is an `internal` package in a different
  # module tree and cannot be imported from server/cmd).
  rules-validate:
    name: Detection Rule Validation (Sigma + YARA)
    needs: changes
    if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install yara CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yara

      - name: Validate rules/sigma and rules/yara
        working-directory: server
        run: go run ./cmd/validate-rules -dir ../rules

  # ── Go: agent ────────────────────────────────────────────────
  agent-build:
    name: Agent Build (Go cross-compile)
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            tags: ""
          # Linux ships with -tags ebpf by default: the eBPF process collector
          # captures short-lived process argv in-kernel. Polling misses sub-second
          # execs (empty process_name/command_line → detection blind spot; measured
          # 8% vs ~full detection, docs/results/live-20260701-linux-discovery-v1.md).
          # Strict superset — auto-falls back to /proc polling when BTF/CAP_BPF is
          # unavailable (agent/internal/platform/linux/process_ebpf.go). Pure Go
          # (embedded bpf2go objects) so CGO_ENABLED=0 cross-compile still works.
          - goos: linux
            goarch: amd64
            suffix: ""
            tags: ebpf
          - goos: darwin
            goarch: arm64
            suffix: ""
            tags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # NetworkMonitor/FilelessMonitor bpf2go bindings are committed (like
      # ProcessMonitor's), so `-tags ebpf` builds anywhere without clang — which is
      # what lets server/Dockerfile ship the eBPF agent. Here we regenerate them
      # anyway and diff, so a change to the .bpf.c sources cannot silently leave
      # the committed bindings (and therefore the shipped agent) behind.
      # Same recipe as agent-ebpf.yml's prevention/tamper generation step, but
      # under plain `-tags ebpf`: both are report-only tracepoint/kprobe monitors
      # with no LSM/enforcement hooks, so neither belongs behind the "prevention"
      # tag. One bpftool build serves both.
      - name: Generate report-only eBPF bindings (Linux only)
        if: matrix.goos == 'linux'
        working-directory: agent
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev pkg-config gcc make git
          test -r /sys/kernel/btf/vmlinux || { echo "runner kernel has no BTF (/sys/kernel/btf/vmlinux)"; exit 1; }
          git clone --depth 1 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          make -C /tmp/bpftool/src
          sudo /tmp/bpftool/src/bpftool btf dump file /sys/kernel/btf/vmlinux format c > ebpf/vmlinux.h
          wc -l ebpf/vmlinux.h
          cd internal/platform/linux
          GOPACKAGE=linux go run github.com/cilium/ebpf/cmd/bpf2go \
            -tags ebpf -cc clang \
            -cflags "-O2 -g -target bpf -D__TARGET_ARCH_x86" \
            NetworkMonitor ../../../ebpf/network_monitor.bpf.c
          GOPACKAGE=linux go run github.com/cilium/ebpf/cmd/bpf2go \
            -tags ebpf -cc clang \
            -cflags "-O2 -g -target bpf -D__TARGET_ARCH_x86" \
            FilelessMonitor ../../../ebpf/fileless_monitor.bpf.c
          ls -1 networkmonitor_bpf* filelessmonitor_bpf*

      # 生成物のドリフト検査。.o は BTF 由来のデバッグ情報でランナーごとに差が出るため、
      # C ソースだけから決まる .go 側を見る。ここが落ちたら .bpf.c を変えたのに
      # バインディングを再生成してコミットしていない、という意味。
      # 直し方: 上のステップと同じ bpf2go コマンドをローカルで流してコミットする
      # （clang と BTF のあるホスト、または Docker: docs/Linuxカーネル防御検証ランブック.md）。
      - name: Check committed eBPF bindings are up to date (Linux only)
        if: matrix.goos == 'linux'
        working-directory: agent
        run: |
          if ! git diff --exit-code -- \
              'internal/platform/linux/networkmonitor_bpf*.go' \
              'internal/platform/linux/filelessmonitor_bpf*.go'; then
            echo "::error::committed bpf2go bindings are stale — regenerate and commit them" >&2
            exit 1
          fi

      - name: Build agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -tags "${{ matrix.tags }}" -ldflags="-s -w" -o edr-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/agent/...

      - name: Build watchdog
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o edr-watchdog-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/watchdog/...

      - name: Upload agent binaries
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/edr-*

  # ── Agent unit tests ─────────────────────────────────────────
  # Runs the agent Go test suite natively on linux/amd64. The agent-build job
  # above only cross-compiles the binaries (windows/linux/darwin) and never
  # executes their test binaries, so the agent's ~8k lines of tests provided
  # zero CI protection until this job. Uses -tags ebpf to match the default
  # Linux agent build (the ebpf collector is pure Go via embedded bpf2go
  # objects, so it compiles without CGO; -race enables cgo for the detector).
  agent-test:
    name: Agent Tests (Go)
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # gofmt ゲート。server 側と同じ理由 (未整形が 337 件まで積み上がっていた)。
      # ビルドを必要としないので eBPF バインディング生成より前に置く — 整形漏れは
      # バインディング生成 (数分) を待たずに落ちたほうが速い。
      - name: gofmt
        working-directory: agent
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "以下のファイルが gofmt 未整形です:"
            gofmt -l .
            echo "--- 差分 ---"
            gofmt -d .
            exit 1
          fi

      # This job compiles with `-tags ebpf`, so it needs the same bindings the
      # agent-build job generates (they aren't committed the way ProcessMonitor's
      # are). Without this, internal/platform/linux fails to build with
      # `undefined: NetworkMonitorObjects` / `undefined: FilelessMonitorObjects`.
      #
      # The Prevention/Tamper/CredAccess LSM bindings are generated here too, so
      # the `ebpf prevention` build — the variant that actually enforces, shipped
      # as edr-agent-linux-amd64-ebpf — gets a per-PR gate. It previously had
      # none: agent-ebpf.yml is workflow_dispatch-only, so nothing type-checked
      # the prevention tag between manual runs. The three extra bpf2go calls are
      # a few seconds of clang each; the expensive part (building bpftool from
      # source to dump the runner's BTF) is already paid for above and reused.
      - name: Generate eBPF bindings (report-only + prevention LSM)
        working-directory: agent
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev pkg-config gcc make git
          test -r /sys/kernel/btf/vmlinux || { echo "runner kernel has no BTF (/sys/kernel/btf/vmlinux)"; exit 1; }
          git clone --depth 1 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          make -C /tmp/bpftool/src
          sudo /tmp/bpftool/src/bpftool btf dump file /sys/kernel/btf/vmlinux format c > ebpf/vmlinux.h
          cd internal/platform/linux
          gen() {
            GOPACKAGE=linux go run github.com/cilium/ebpf/cmd/bpf2go \
              -tags "$1" -cc clang \
              -cflags "-O2 -g -target bpf -D__TARGET_ARCH_x86" \
              "$2" "../../../ebpf/$3"
          }
          gen "ebpf"            NetworkMonitor       network_monitor.bpf.c
          gen "ebpf"            FilelessMonitor      fileless_monitor.bpf.c
          gen "ebpf prevention" PreventionLSM        prevention_lsm.bpf.c
          gen "ebpf prevention" TamperLSM            tamper_lsm.bpf.c
          gen "ebpf prevention" CredAccessLSM        credaccess_lsm.bpf.c
          # HostIntegrityMonitor and TLSMonitor landed AFTER the last successful
          # run of agent-ebpf.yml (2026-07-20) and were never added to any
          # generation list. `-tags "ebpf prevention"` has therefore been broken
          # on main ever since, with `undefined: HostIntegrityMonitorObjects` /
          # `undefined: TLSMonitorObjects` — invisible because that build had no
          # CI gate and its workflow only ran on manual dispatch. This gate is
          # what surfaced it; keep this list in step with the `linux && ebpf &&
          # prevention` runners in internal/platform/linux.
          gen "ebpf prevention" HostIntegrityMonitor hostintegrity_monitor.bpf.c
          gen "ebpf prevention" TLSMonitor           tls_monitor.bpf.c
          ls -1 networkmonitor_bpf* filelessmonitor_bpf* \
                preventionlsm_bpf* tamperlsm_bpf* credaccesslsm_bpf* \
                hostintegritymonitor_bpf* tlsmonitor_bpf*

      # staticcheck は server ジョブにはあったが agent には無く、指摘が 16 件
      # 溜まっていた (#601 で解消)。同じことを繰り返さないようゲートを置く。
      #
      # 既定タグと ebpf タグの両方を解析する。
      #
      # 両方回すのは、ビルドタグで分かれたファイルの指摘が片方でしか出ない
      # ためで、これは実際に起きた: credNoiseFiltered / hostIntegrityNoiseFiltered
      # の U1000 は「宣言が既定タグ、加算が ebpf && prevention」というずれで、
      # 既定タグ側でのみ検出された。逆に ebpf 側にしか無いコードの指摘は、
      # 既定タグだけでは永久に出ない。
      #
      # このステップは上の bpf2go バインディング生成の後に置く必要がある。
      # 生成前だと -tags ebpf で internal/platform/linux が undefined になる。
      #
      # `ebpf prevention` も解析対象。防御を実際に有効化する唯一のビルドであり、
      # ここを外すと「出荷する構成だけ静的解析されない」状態になる。バインディング
      # は上のステップで生成済み。
      #
      # バージョンは server ジョブと同じ v0.7.0 に固定する。2つのジョブが別々の
      # staticcheck を使うと、同じコードが片方だけ赤くなる状態が起こり得る。
      - name: staticcheck
        working-directory: agent
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          staticcheck -tags ebpf ./...
          staticcheck -tags "ebpf prevention" ./...

      # Coverage was previously unmeasured for the agent module entirely — only
      # server/ had a coverage.yml badge/gate. Mirrors the server's approach:
      # measure on every PR, gate on a threshold, upload the report. Baseline
      # measured locally was 33.1%; the 30% gate leaves headroom while still
      # catching a real regression (matches server-test's ratcheting pattern).
      - name: Unit tests (with coverage)
        working-directory: agent
        run: |
          go test -tags ebpf -race -timeout 120s \
            -coverprofile=coverage.out -covermode=atomic \
            ./...

      - name: Check coverage threshold (30%)
        working-directory: agent
        run: |
          COVERAGE=$(go tool cover -func=coverage.out \
            | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < 30) }"; then
            echo "ERROR: Coverage ${COVERAGE}% is below the 30% threshold."
            exit 1
          fi
          echo "Coverage check passed: ${COVERAGE}% >= 30%"

      - name: Generate HTML coverage report
        working-directory: agent
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: agent-coverage
          path: |
            agent/coverage.out
            agent/coverage.html
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true   # Non-blocking if token not configured
        with:
          files: agent/coverage.out
          flags: agent
          name: agent-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      # Cross-platform compile check for the Windows/macOS agent packages.
      # Those packages are OS-tagged (//go:build windows / darwin), so the
      # linux unit-test step above cannot compile them and executing their
      # tests would need costly Windows/macOS runners. `go vet` with GOOS set
      # type-checks and compiles each package *including its _test.go files*
      # without running them, so signature drift and compile rot in the
      # Windows/macOS collectors and their tests is caught per-PR on this cheap
      # ubuntu runner — the class of bug (e.g. a struct-layout mismatch) that
      # went undetected while agent tests never ran in CI at all.
      # The enforcing Linux variant (edr-agent-linux-amd64-ebpf). This is the only
      # build in which the LSM exec-prevention, tamper-protection and credential-
      # access hooks exist at all, so "does it still compile and do its tests
      # pass" was previously answered only by a manual agent-ebpf.yml dispatch —
      # in practice, weeks apart. Built and tested here on every PR.
      #
      # No -race and no coverage: the shared code is already covered by the
      # -tags ebpf run above, and this step exists to catch compile rot plus the
      # prevention-only unit tests (blocklist mapping, path aliasing, decision
      # parsing). Loading the LSM needs an lsm=bpf kernel and is not attempted —
      # the runners have no BPF LSM, and the runtime path is fail-open by design.
      - name: Build & test the enforcing variant (ebpf prevention)
        working-directory: agent
        run: |
          go build -tags "ebpf prevention" -ldflags="-s -w" -o /tmp/edr-agent-ebpf ./cmd/agent/...
          go build -tags "ebpf prevention" -ldflags="-s -w" -o /tmp/edr-watchdog-ebpf ./cmd/watchdog/...
          go test -tags "ebpf prevention" -timeout 120s ./...

      - name: Cross-platform vet (windows/darwin)
        working-directory: agent
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin  GOARCH=arm64 go vet ./...
          # Windows kernel-driver prevention variant. Its four driver-facing files
          # (prevention_driver.go / cred_driver_windows.go / tamper_driver_windows.go
          # / pathalias_windows.go) and their tests are behind `windows && prevention`
          # and were type-checked by nothing at all: the plain `go vet` above drops
          # them, and no Windows runner exists. When this gate was first added it
          # immediately found that pathalias_windows_test.go had never compiled
          # (a `contains` helper colliding with auth_parse_test.go's).
          GOOS=windows GOARCH=amd64 go vet -tags prevention ./...
          # macOS EndpointSecurity (ESF) build variant + its prevention combo.
          #
          # Over ./... , not just ./internal/platform/darwin/... . Narrowing it to
          # that one package is what let `-tags esf` stay unbuildable unnoticed:
          # the ESF collector is a cgo file, CGO_ENABLED=0 here drops it, and the
          # polling fallback was excluded by `!esf` — so both implementations
          # vanished and NewDarwinProcessCollector was undefined. Nothing in the
          # darwin package references it, so a package-scoped vet passed; the
          # error only appears at the call site in cmd/agent.
          #
          # This is a compile gate for the cgo-less shape of the build. The real
          # ESF compile (CGO_ENABLED=1, EndpointSecurity.h) needs a macOS host
          # and lives in agent-macos-esf.yml.
          GOOS=darwin  GOARCH=arm64 go vet -tags esf ./...
          GOOS=darwin  GOARCH=arm64 go vet -tags "esf prevention" ./...

  # ── Server dependency vulnerability scan (govulncheck) ────────
  # 独立ジョブであることが重要。以前は server-test ジョブの中間ステップだったため、
  # 依存に脆弱性が1件出るだけで後続の Unit tests / Synthetic injection E2E /
  # Build all services が丸ごと skipped になり、テストゲートが静かに消えていた
  # (GO-2026-6061 が main で赤かった数日間、実際にサーバのユニットテストは
  #  一度も実行されていない)。脆弱性は脆弱性として、テストはテストとして
  # それぞれ独立に赤くなるべきなので、agent-vulncheck と同じ形に揃えた。
  server-vulncheck:
    name: Server Vulnerability Check (govulncheck)
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # govulncheck もバージョンを固定する。ただし固定の意味は staticcheck とは
      # 違う。staticcheck の @latest は新しい検査が増えるだけでコードが赤くなるが、
      # govulncheck が報告する脆弱性は「解析エンジンの版」ではなく「実行時に
      # 取得する脆弱性データベース」に由来する。DB は毎回 vuln.go.dev から
      # 取り直されるので、版を固定しても新規 CVE の検知力は一切落ちない。
      #
      # 固定して防げるのは解析エンジン側の事故だけ:
      #   - 新リリースが go.mod より新しい Go ツールチェインを要求して install が失敗する
      #   - 出力形式や終了コードが変わる
      #   - 到達可能性解析のリグレッションで既知の脆弱性を見落とす
      # いずれもコード無変更で CI の色が変わる事象なので、pin する価値はある。
      #
      # 注意: Dependabot の github-actions エコシステムは `uses:` しか見ないため、
      # run: の中の go install ...@vX.Y.Z は自動更新されない (staticcheck の
      # v0.7.0 も同様)。上げるのは手動。放置すると解析エンジンだけが古びる。
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck
        working-directory: server
        run: govulncheck ./...

  # ── Agent dependency vulnerability scan (govulncheck) ─────────
  # Runs once on linux/amd64 (independent of the cross-compile matrix above).
  # Mirrors server-vulncheck so both Go modules are covered by Go's official
  # vuln database (replaces the removed nancy job in security.yml, which
  # suffered OSS Index 401s).
  agent-vulncheck:
    name: Agent Vulnerability Check (govulncheck)
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # server-vulncheck と同じ版に揃える。揃えないと、同じ脆弱性が
      # 片方のモジュールでだけ報告される状態が起こり得る (staticcheck を
      # agent 側にも入れた時と同じ理由)。固定の意味は server-vulncheck の
      # コメントを参照。
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck
        working-directory: agent
        run: govulncheck ./...

  # ── Frontend ──────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --prefer-offline

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      # 本番ビルド(NEXT_PUBLIC_USE_MOCK != 'true')で描画されてしまう
      # モックデータ参照を落とす。28 箇所が素通しになっていた実績があり、
      # 「データが少ないだけ」に見えるので目視では気づけない。
      - name: Mock guard check
        working-directory: frontend
        run: node scripts/check-mock-guards.mjs

      # Vitest unit/component tests (frontend/tests/**). Previously these were
      # never run in CI — only lint, typecheck, build, and the separate
      # Playwright e2e job ran — so component and lib-level regressions could
      # merge undetected.
      # Now that the Playwright e2e job runs nightly (integration.yml) rather than
      # per-push, this is the frontend's only per-push behavioral safety net.
      #
      # `npm test` ではなく test:coverage を呼ぶ。走るテストは同じで、
      # 追加でカバレッジ計測の経路も踏む。この差は実測 1 秒（6s → 7s）。
      #
      # わざわざそうするのは、test:coverage が実際に壊れていた実績が
      # あるため。vitest.config.ts に coverage 設定があり package.json に
      # スクリプトもあるのに、プロバイダ (@vitest/coverage-v8) が
      # devDependencies に無く、叩けば落ちる状態だった。CI が npm test しか
      # 呼んでいなかったので誰も気づけない。ここで踏んでおけば同じ壊れ方は
      # しない。閾値ゲートは置いていない（server 側の Check coverage
      # threshold のような下限は、フロントには未設定）。
      - name: Unit tests (Vitest, with coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next/standalone
          retention-days: 1

  # ── SDKs (Python + TypeScript) ───────────────────────────────
  # The client SDKs shipped to customers had no CI test execution at all: the
  # Python suite (pytest, 56 tests) was never invoked by any workflow, and the
  # TypeScript suite (vitest, 45 tests) existed on disk but the package had no
  # `test` script or vitest devDependency to run it with — so both suites were
  # silent dead weight that regressions could sail through undetected.
  sdk-test:
    name: SDK Tests (Python + TypeScript)
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python SDK dev dependencies
        working-directory: sdk/python
        run: pip install -r requirements-dev.txt

      - name: Python SDK tests
        working-directory: sdk/python
        run: pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm install

      - name: TypeScript SDK typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: TypeScript SDK tests
        working-directory: sdk/typescript
        run: npm test

  # ── Backup / Restore integrity test ──────────────────────────
  backup-test:
    name: Backup & Restore Integrity Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: edr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Create test table and insert data
        run: |
          psql postgresql://postgres:testpass@localhost/edr_test \
            -c "CREATE TABLE backup_test (id serial, val text); INSERT INTO backup_test VALUES (1, 'hello');"

      - name: Run backup (local mode)
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost/edr_test
          BACKUP_DIR: /tmp/backups
          BACKUP_DEST: local
        run: |
          mkdir -p /tmp/backups
          bash deploy/backup/backup.sh --local

      - name: Verify backup file and checksum exist
        run: |
          ls -la /tmp/backups/
          test -f /tmp/backups/edr_backup_*.dump.gz
          test -f /tmp/backups/edr_backup_*.dump.gz.sha256

      - name: Verify checksum integrity
        run: |
          cd /tmp/backups
          sha256sum --check edr_backup_*.dump.gz.sha256

      - name: Drop table and restore from backup
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost/edr_test
        run: |
          psql postgresql://postgres:testpass@localhost/edr_test \
            -c "DROP TABLE backup_test;"
          BACKUP_FILE=$(ls /tmp/backups/edr_backup_*.dump.gz | head -1)
          bash deploy/backup/restore.sh --force "$BACKUP_FILE"

      - name: Verify restored data
        run: |
          psql postgresql://postgres:testpass@localhost/edr_test \
            -c "SELECT val FROM backup_test WHERE id=1;" | grep hello

