openapi: "3.0.3"
info:
  title: Kizashi API
  version: "1.0.0"
  description: |
    Kizashi REST API — エンドポイント検知・対応プラットフォーム

    ## この仕様の読み方
    操作は 2 種類あります。

    - **手書き** — 要求/応答の形状まで記載され、CI で実装との一致を検証しています
    - **`x-generated: true`** — router.go から自動生成。パス・メソッド・認証要否・
      パスパラメータが実装と一致することだけを保証します。要求/応答の形状は
      未記載です（書けないものを書かないための意図的な空白です）

    再生成は `cd server && go run ./cmd/openapi-sync`。CI は `-check` で
    実装との差分を落とします。

    ## 認証
    すべての保護されたエンドポイントは `Authorization: Bearer <JWT>` ヘッダーが必要です。
    `/api/v1/auth/login` でJWTトークンを取得してください。

    ## レート制限
    - 認証済みリクエスト: 1000 req/分
    - 認証エンドポイント: 10 req/分
  contact:
    name: Kizashi
    url: https://github.com/kizashi-labs/kizashi/issues
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:8080
    description: 開発サーバー
  - url: https://api.kizashi-edr.example.com
    description: 本番サーバー

security:
  - BearerAuth: []

tags:
  - name: auth
    description: 認証・認可
  - name: agents
    description: エンドポイントエージェント管理
  - name: alerts
    description: セキュリティアラート
  - name: incidents
    description: インシデント管理
  - name: rules
    description: 検知ルール
  - name: users
    description: ユーザー管理
  - name: invitations
    description: ユーザー招待
  - name: support
    description: サポートチケット
  - name: billing
    description: 課金・サブスクリプション
  - name: compliance
    description: コンプライアンス
  - name: threat-intel
    description: 脅威インテリジェンス
  - name: reports
    description: レポート生成
  - name: settings
    description: システム設定
  - name: system
    description: システム情報・ヘルスチェック
  - name: users
    description: ユーザー管理
  - name: API Keys
    description: APIキー管理
  - name: Live Response
    description: ライブレスポンス
  - name: Vulnerabilities
    description: 脆弱性管理
  - name: Enrollment
    description: エージェント登録
  - name: DLP
    description: データ損失防止

paths:
  # ── Auth ────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT アクセストークン
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: ログアウト
      responses:
        "200":
          description: ログアウト成功
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: アクセストークン更新
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: リフレッシュトークン
      responses:
        "200":
          description: 新しいアクセストークン
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWTアクセストークン
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: パスワードリセットリクエスト
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: メールを送信しました（メール存在有無に関わらず200）
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: パスワードリセット確認
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: パスワードを変更しました
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/invite/info:
    get:
      operationId: getInviteInfo
      tags: [auth]
      summary: 招待情報取得
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 招待情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  role:
                    type: string
  /api/v1/auth/invite/accept:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: 招待を受諾してアカウント作成
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                full_name:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: アカウントを作成しました

  # ── Agents ─────────────────────────────────────────────────────
  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: エージェント一覧取得
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, isolated, error, inactive]
        - name: os
          in: query
          description: os_type の完全一致
          schema:
            type: string
            enum: [windows, linux, darwin, unknown]
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: ホスト名・IPアドレスの部分一致
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: 1〜1000。範囲外は 20 にフォールバックする。別名 limit も可
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: エージェント一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  has_more:
                    type: boolean
  /api/v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: エージェント詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: エージェント詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [agents]
      summary: PUT /api/v1/agents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: putAgentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    patch:
      tags: [agents]
      summary: PATCH /api/v1/agents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: patchAgentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    delete:
      tags: [agents]
      summary: DELETE /api/v1/agents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: deleteAgentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
  /api/v1/agents/{id}/isolate:
    post:
      operationId: isolateAgent
      tags: [agents]
      summary: エージェントのネットワーク隔離
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 隔離コマンドを送信しました
  /api/v1/agents/{id}/unisolate:
    post:
      operationId: unisolateAgent
      tags: [agents]
      summary: エージェントの隔離解除
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 隔離解除コマンドを送信しました
  /api/v1/agents/{id}/effective-config:
    get:
      operationId: getAgentEffectiveConfig
      tags: [agents]
      summary: エージェントの実効設定取得（ポリシー + エージェント個別設定のマージ結果）
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 実効設定マップ
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  effective:
                    type: object
                    additionalProperties: true
                    description: キー→値の設定マップ（スキーマ定義による）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/agent-config/schema:
    get:
      operationId: getAgentConfigSchema
      tags: [agents]
      summary: エージェント設定スキーマ取得（有効なキー・型・デフォルト値・制約の一覧）
      responses:
        "200":
          description: 設定スキーマ
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        type:
                          type: string
                        default:
                          description: デフォルト値
                        min:
                          type: integer
                        max:
                          type: integer
                        enum:
                          type: array
                          items:
                            type: string
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Alerts ─────────────────────────────────────────────────────
  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: アラート一覧取得
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low, info]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved, false_positive]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: アラート一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  total:
                    type: integer
  /api/v1/alerts/{id}:
    get:
      operationId: getAlert
      tags: [alerts]
      summary: アラート詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: アラート詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
    put:
      tags: [alerts]
      summary: PUT /api/v1/alerts/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: putAlertsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
  /api/v1/incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: インシデント一覧取得
      responses:
        "200":
          description: インシデント一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: インシデント作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity]
              properties:
                title:
                  type: string
                severity:
                  type: string
                  enum: [critical, high, medium, low]
                description:
                  type: string
      responses:
        "201":
          description: インシデントを作成しました
  /api/v1/incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: インシデント詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: インシデント詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
    put:
      tags: [incidents]
      summary: PUT /api/v1/incidents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: putIncidentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    delete:
      tags: [incidents]
      summary: DELETE /api/v1/incidents/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: deleteIncidentsId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
  /api/v1/rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: 検知ルール一覧取得
      responses:
        "200":
          description: ルール一覧
    post:
      operationId: createRule
      tags: [rules]
      summary: 検知ルール作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: ルールを作成しました
  /api/v1/rules/{id}:
    get:
      operationId: getRule
      tags: [rules]
      summary: 検知ルール詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: ルール詳細
    put:
      operationId: updateRule
      tags: [rules]
      summary: 検知ルール更新
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: 更新成功
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: 検知ルール削除
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 削除成功

  # ── Users ──────────────────────────────────────────────────────
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [users]
      summary: ユーザー一覧取得（管理者）
      responses:
        "200":
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
    post:
      tags: [admin]
      summary: POST /api/v1/admin/users
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: postAdminUsers
      x-generated: true
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
  /api/v1/admin/users/{id}:
    get:
      tags: [admin]
      summary: GET /api/v1/admin/users/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: getAdminUsersId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    put:
      tags: [admin]
      summary: PUT /api/v1/admin/users/{id}
      description: 実装の存在のみ自動検証。要求/応答の形状は未記載。
      operationId: putAdminUsersId
      x-generated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Undocumented" }
    delete:
      operationId: deleteAdminUser
      tags: [users]
      summary: ユーザー削除（管理者）
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 削除成功

  # ── Invitations ────────────────────────────────────────────────
  /api/v1/admin/invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: 招待一覧取得
      responses:
        "200":
          description: 招待一覧
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: ユーザー招待送信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, analyst, viewer]
                  default: analyst
      responses:
        "201":
          description: 招待を送信しました
  /api/v1/admin/invitations/{id}:
    delete:
      operationId: deleteInvitation
      tags: [invitations]
      summary: 招待を取り消す
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: 削除成功

  # ── Support Tickets ────────────────────────────────────────────
  /api/v1/support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: サポートチケット一覧取得
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: チケット一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: サポートチケット作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                subject:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                category:
                  type: string
      responses:
        "201":
          description: チケットを作成しました
  /api/v1/support/tickets/{id}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: サポートチケット詳細取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: チケット詳細
    patch:
      operationId: updateSupportTicket
      tags: [support]
      summary: サポートチケット更新
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved, closed]
                priority:
                  type: string
      responses:
        "200":
          description: 更新成功
  /api/v1/support/tickets/{id}/comments:
    get:
      operationId: listTicketComments
      tags: [support]
      summary: チケットコメント一覧取得
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: コメント一覧
    post:
      operationId: addTicketComment
      tags: [support]
      summary: チケットコメント追加
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                is_internal:
                  type: boolean
                  description: 管理者のみ表示（内部メモ）
                  default: false
      responses:
        "201":
          description: コメントを追加しました
  /api/v1/admin/support/stats:
    get:
      operationId: getSupportStats
      tags: [support]
      summary: サポート統計取得（管理者）
      responses:
        "200":
          description: サポート統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  open:
                    type: integer
                  in_progress:
                    type: integer
                  high_priority:
                    type: integer
                  resolved_today:
                    type: integer

  # ── Billing ────────────────────────────────────────────────────
  /api/v1/compliance/summary:
    get:
      operationId: getComplianceSummary
      tags: [compliance]
      summary: コンプライアンスサマリー取得
