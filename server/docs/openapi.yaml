                        can_write: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /taxii2/api1/collections/{id}/objects:
    get:
      operationId: getTAXIICollectionObjects
      tags: [threat-intel]
      summary: TAXIIコレクションオブジェクト取得
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: match[type]
          in: query
          schema: { type: string }
        - name: added_after
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: STIXオブジェクト一覧
          content:
            application/taxii+json:
              schema:
                type: object
                properties:
                  type: { type: string, example: bundle }
                  objects:
                    type: array
                    items: { type: object }
