        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        status:
          type: string
          enum: [open, investigating, resolved, false_positive]
        rule_name:
          type: string
        agent_id:
          type: string
          format: uuid
        hostname:
          type: string
        mitre_technique:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, contained, resolved, closed]
        assigned_to:
          type: string
        created_at:
          type: string
          format: date-time

    RuleInput:
      type: object
