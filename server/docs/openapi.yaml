openapi: 3.0.3
info:
  title: EDR Platform API
  description: |
    Kizashi — エンドポイント検知・対応プラットフォーム REST API

    ## 認証
    すべての保護エンドポイントは `Authorization: Bearer <JWT>` ヘッダーが必要です。
    `/auth/login` でJWTを取得してください。

    ## レート制限
    認証エンドポイントは 10回/5分/IP に制限されています。
  version: "1.0.0"
  contact:
    name: EDR Platform
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "エラーメッセージ"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        pre_auth_token:
          type: string
          description: MFA有効時に返されるpre-authトークン
        mfa_required:
          type: boolean

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        os:
          type: string
          enum: [windows, linux, darwin]
        ip_address:
          type: string
        status:
          type: string
          enum: [online, offline, isolated]
        version:
          type: string
        last_seen:
          type: string
          format: date-time
        risk_score:
          type: integer
          minimum: 0
          maximum: 100

    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        severity:
          type: integer
          minimum: 1
          maximum: 10
        status:
          type: string
          enum: [open, investigating, resolved, false_positive]
        rule_name:
          type: string
        hostname:
          type: string
        agent_id:
          type: string
          format: uuid
        mitre_tactic:
          type: string
        mitre_technique:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        severity:
          type: integer
          minimum: 1
          maximum: 10
        enabled:
          type: boolean
        sigma_yaml:
          type: string
        created_at:
          type: string
          format: date-time

    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        severity:
          type: integer
        status:
          type: string
          enum: [open, investigating, contained, resolved, closed]
        assignee_id:
          type: string
          format: uuid
        external_ticket_id:
          type: string
        external_ticket_url:
          type: string
        created_at:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
        agent_count:
          type: integer
        user_count:
          type: integer
        created_at:
          type: string
          format: date-time

    AgentPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scan_interval_min:
          type: integer
          minimum: 5
          maximum: 1440
        cpu_limit_pct:
          type: integer
          minimum: 5
          maximum: 80
        log_level:
          type: string
          enum: [debug, info, warn, error]

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        has_more:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, analyst, viewer]
        enabled:
          type: boolean
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alert_id:
          type: string
          format: uuid
        author_id:
          type: string
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [alert_summary, incident_summary, compliance, executive]
        status:
          type: string
          enum: [pending, generating, completed, failed]
        format:
          type: string
          enum: [pdf, csv, json]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [read, write, admin]
        client_id:
          type: string
          description: マスクされたクライアントID（末尾4文字のみ表示）
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LiveResponseSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed, expired]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    Vulnerability:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cve_id:
          type: string
          example: CVE-2024-12345
        title:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        cvss_score:
          type: number
          minimum: 0
          maximum: 10
        agent_id:
          type: string
          format: uuid
        hostname:
          type: string
        package_name:
          type: string
        package_version:
          type: string
        fixed_version:
          type: string
        detected_at:
          type: string
          format: date-time

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: リクエストが不正です
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 認証が必要です
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: アクセス権限がありません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: リクエスト数制限超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # ── Auth ──────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Authentication]
      summary: ログイン
      description: ユーザー名とパスワードでJWTを取得します。MFA有効時はpre_auth_tokenが返されます。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: トークン更新
      responses:
        '200':
          description: 新しいJWTトークン
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: 無効なトークン

  /auth/logout:
    post:
      tags: [Authentication]
      summary: ログアウト
      description: JWTをサーバー側でブロックリストに追加します。
      responses:
        '200':
          description: ログアウト成功

  /auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: MFA検証
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token:
                  type: string
                  description: pre_auth_token
                code:
                  type: string
                  description: TOTPコード (6桁)
      responses:
        '200':
          description: MFA検証成功、フルJWT返却

  # ── Agents ────────────────────────────────────────────────────
  /agents:
    get:
      tags: [Agents]
      summary: エージェント一覧
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, isolated]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: エージェント一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  total:
                    type: integer

  /agents/{id}:
    get:
      tags: [Agents]
      summary: エージェント詳細
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: エージェント詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: 見つかりません

  /agents/{id}/isolate:
    post:
      tags: [Agents]
      summary: エージェントを隔離
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 隔離成功

  /agents/{id}/unisolate:
    post:
      tags: [Agents]
      summary: 隔離解除
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 隔離解除成功

  # ── Alerts ────────────────────────────────────────────────────
  /alerts:
    get:
      tags: [Alerts]
      summary: アラート一覧
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: severity_min
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: アラート一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
                  total:
                    type: integer

  /alerts/stats:
    get:
      tags: [Alerts]
      summary: アラート統計
      responses:
        '200':
          description: 統計情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  open:
                    type: integer
                  critical:
                    type: integer
                  high:
                    type: integer
                  investigating:
                    type: integer

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: アラート詳細
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: アラート詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
    put:
      tags: [Alerts]
      summary: アラート更新
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                assignee_id:
                  type: string
      responses:
        '200':
          description: 更新成功

  # ── Detection Rules ───────────────────────────────────────────
  /rules:
    get:
      tags: [Rules]
      summary: 検知ルール一覧
      responses:
        '200':
          description: ルール一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
    post:
      tags: [Rules]
      summary: ルール作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sigma_yaml]
              properties:
                name:
                  type: string
                severity:
                  type: integer
                sigma_yaml:
                  type: string
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'

  /rules/{id}/toggle:
    put:
      tags: [Rules]
      summary: ルール有効/無効切り替え
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 切り替え成功

  # ── Incidents ─────────────────────────────────────────────────
  /incidents:
    get:
      tags: [Incidents]
      summary: インシデント一覧
      responses:
        '200':
          description: インシデント一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
    post:
      tags: [Incidents]
      summary: インシデント作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                severity:
                  type: integer
                description:
                  type: string
      responses:
        '201':
          description: 作成成功

  /incidents/{id}/ticket:
    post:
      tags: [Incidents, SOAR]
      summary: 外部チケット手動作成 (Jira/ServiceNow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_id]
              properties:
                config_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: チケット作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket_id:
                    type: string
                  ticket_url:
                    type: string

  # ── Tenants ───────────────────────────────────────────────────
  /tenants:
    get:
      tags: [Tenants]
      summary: テナント一覧 (admin only)
      responses:
        '200':
          description: テナント一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      tags: [Tenants]
      summary: テナント作成 (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                plan:
                  type: string
      responses:
        '201':
          description: 作成成功

  /tenants/{id}/roles:
    get:
      tags: [Tenants]
      summary: テナントロール一覧 (admin / tenant_admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ロール一覧

  /tenants/{id}/roles/{user_id}:
    put:
      tags: [Tenants]
      summary: テナントロール設定 (admin / tenant_admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [tenant_admin, analyst, viewer]
      responses:
        '200':
          description: ロール設定成功
    delete:
      tags: [Tenants]
      summary: テナントロール削除
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 削除成功

  # ── Agent Policies ────────────────────────────────────────────
  /agent-policies:
    get:
      tags: [Agent Policies]
      summary: ポリシー一覧
      responses:
        '200':
          description: ポリシー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentPolicy'
    post:
      tags: [Agent Policies]
      summary: ポリシー作成 (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPolicy'
      responses:
        '201':
          description: 作成成功

  # ── Cloud Monitoring ──────────────────────────────────────────
  /cloud/integrations:
    get:
      tags: [Cloud Monitoring]
      summary: クラウド統合一覧
      responses:
        '200':
          description: 統合一覧
    post:
      tags: [Cloud Monitoring]
      summary: クラウド統合追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, region]
              properties:
                name:
                  type: string
                provider:
                  type: string
                  enum: [aws, azure, gcp]
                region:
                  type: string
                config:
                  type: object
      responses:
        '201':
          description: 作成成功

  /cloud/events:
    get:
      tags: [Cloud Monitoring]
      summary: クラウドイベント一覧
      parameters:
        - name: provider
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: イベント一覧

  # ── SOAR ──────────────────────────────────────────────────────
  /soar/configs:
    get:
      tags: [SOAR]
      summary: SOAR設定一覧 (admin only)
      responses:
        '200':
          description: 設定一覧
    post:
      tags: [SOAR]
      summary: SOAR設定作成 (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [jira, servicenow]
                config:
                  type: object
                min_severity:
                  type: integer
                  default: 7
                auto_create:
                  type: boolean
                  default: false
      responses:
        '201':
          description: 作成成功

  /soar/configs/{id}/test:
    post:
      tags: [SOAR]
      summary: SOAR接続テスト
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 接続成功
        '502':
          description: 接続失敗

  # ── Forensics ─────────────────────────────────────────────────
  /forensics/jobs:
    get:
      tags: [Forensics]
      summary: フォレンジクスジョブ一覧
      responses:
        '200':
          description: ジョブ一覧
    post:
      tags: [Forensics]
      summary: フォレンジクスジョブ作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, type]
              properties:
                agent_id:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum: [process_list, memory_dump, artifacts]
      responses:
        '201':
          description: ジョブ作成成功

  # ── Compliance ────────────────────────────────────────────────
  /compliance/frameworks:
    get:
      tags: [Compliance]
      summary: コンプライアンスフレームワーク一覧
      responses:
        '200':
          description: フレームワーク一覧 (SOC2, ISO27001, PCI-DSS)

  /compliance/score/{framework_id}:
    get:
      tags: [Compliance]
      summary: フレームワークのスコア
      parameters:
        - name: framework_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: スコア (pass/fail/partial per control)

  # ── Health ────────────────────────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: ヘルスチェック
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: サービス正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  db:
                    type: string
                  time:
                    type: string
                    format: date-time
        '503':
          description: サービス低下

  /metrics:
    get:
      tags: [System]
      summary: Prometheusメトリクス
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Prometheusフォーマットのメトリクス
          content:
            text/plain:
              schema:
                type: string

  # ── WebSocket/SSE ──────────────────────────────────────────────
  /ws/alerts:
    get:
      tags: [Realtime]
      summary: アラートSSEストリーム
      description: |
        Server-Sent Events ストリーム。`type: alert` メッセージを配信します。

        例: `data: {"type":"alert","data":{...},"time":"..."}`
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: SSEストリーム
          content:
            text/event-stream:
              schema:
                type: string

  /ws/cloud:
    get:
      tags: [Realtime]
      summary: クラウドイベントSSEストリーム
      description: |
        Server-Sent Events ストリーム。`type: cloud_event` メッセージを配信します。
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: SSEストリーム
          content:
            text/event-stream:
              schema:
                type: string

  # ── Agent mTLS Certificate Enrollment ─────────────────────────
  /agents/{id}/cert/ca:
    get:
      tags: [Certificates]
      summary: CA証明書取得
      description: エージェントがmTLSトラストチェーンを構成するためのCA証明書PEMを返します。認証不要。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CA証明書PEM
          content:
            application/x-pem-file:
              schema:
                type: string
        '503':
          description: CAが初期化されていません

  /agents/{id}/cert/enroll:
    post:
      tags: [Certificates]
      summary: エージェント証明書エンロール
      description: CSRを受け取り、CAで署名したエージェント証明書を返します。JWTまたはエンロールトークンが必要。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              properties:
                csr_pem:
                  type: string
                  description: PEMエンコードされた証明書署名要求 (CSR)
      responses:
        '200':
          description: 署名済み証明書
          content:
            application/json:
              schema:
                type: object
                properties:
                  cert_pem:
                    type: string
                    description: PEMエンコードされた署名済みエージェント証明書
        '400':
          description: CSR不正または署名失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: CAが初期化されていません

  # ── Users ──────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: ユーザー一覧
      description: 全ユーザーを返します（admin only）。
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, analyst, viewer]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: ユーザー作成
      description: 新しいユーザーを作成します（admin only）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                full_name:
                  type: string
                role:
                  type: string
                  enum: [admin, analyst, viewer]
                  default: analyst
      responses:
        '201':
          description: 作成されたユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: メールアドレスが既に使用されています

  /users/{id}:
    get:
      tags: [Users]
      summary: ユーザー詳細
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: ユーザー詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: ユーザー更新
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                role:
                  type: string
                  enum: [admin, analyst, viewer]
                enabled:
                  type: boolean
      responses:
        '200':
          description: 更新されたユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: ユーザー削除
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 削除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/password:
    put:
      tags: [Users]
      summary: パスワード変更
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: 変更成功
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Alert Actions ───────────────────────────────────────────────
  /alerts/{id}/status:
