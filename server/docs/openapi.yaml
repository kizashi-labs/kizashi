          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除成功
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Bulk Alert Operations ───────────────────────────────────────
  /alerts/bulk-status:
    post:
      tags: [Alerts]
      summary: アラート一括ステータス更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                status:
                  type: string
                  enum: [open, investigating, resolved, suppressed]
      responses:
        '200':
          description: 更新件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  status:
                    type: string

  /alerts/bulk-delete:
    post:
      tags: [Alerts]
      summary: アラート一括削除
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        '200':
          description: 削除件数
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /alerts/bulk-tag:
    post:
      tags: [Alerts]
      summary: アラート一括タグ付け
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, tag]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                tag:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 更新件数

  /alerts/bulk-assign:
    post:
      tags: [Alerts]
      summary: アラート一括アサイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, user_id]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                user_id:
                  type: string
      responses:
        '200':
          description: 更新件数

  /alerts/export:
    get:
      tags: [Alerts]
      summary: アラートエクスポート (CSV/JSON)
      description: アラートをCSVまたはJSONでエクスポートします。重い操作のため1回/分に制限されています。
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: エクスポートデータ
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
        '429':
          description: レート制限超過

