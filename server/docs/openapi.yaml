components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Undocumented:
      description: |
        自動生成の操作。実装は存在しますが、応答の形状は未記載です。
        ここを埋めるときは、その操作を手書きセクションへ移してください。
    RateLimited:
      description: リクエスト数制限超過
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: リクエストが不正です
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認証が必要です
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: アクセス権限がありません
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: レート制限を超過しました
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: |
        現在のライセンスプランで利用可能な機能・上限を超えています。
        レスポンスボディの `error` フィールドで原因を判別:
        - `plan_required`: 機能ゲート (例: MDM を Lite テナントが叩いた) — `feature` / `required_plan` / `upgrade_message` を含む
        - `agent_limit_reached`: エージェント上限超過 — `agent_limit` / `agents_active` / `plan` を含む
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/PlanRequiredError"
              - $ref: "#/components/schemas/AgentLimitReachedError"

  schemas:
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
        agent_count:
          type: integer
        user_count:
          type: integer
        created_at:
          type: string
          format: date-time
    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        severity:
          type: integer
          minimum: 1
          maximum: 10
        enabled:
          type: boolean
        sigma_yaml:
          type: string
        created_at:
          type: string
          format: date-time
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        pre_auth_token:
          type: string
          description: MFA有効時に返されるpre-authトークン
        mfa_required:
          type: boolean
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
    Error:
      type: object
      properties:
        error:
          type: string
          example: エラーメッセージ

    PlanRequiredError:
      type: object
      description: |
        `RequireFeature` ミドルウェアが返す 402 エラー (`server/internal/middleware/plan_gate.go`)。
        現在のライセンスが必要な機能を含まない場合に返される。
      required: [error, feature, required_plan, upgrade_message]
      properties:
        error:
          type: string
          enum: [plan_required]
        feature:
          type: string
          description: |
            アクセスを試みた機能の名前 (`server/internal/license/manager.go` の `Feature*` 定数)。
          enum:
            - basic_detection
            - alerts
            - reports
            - mdm
            - ai_investigation
            - siem_integration
            - playbooks
            - threat_intel
            - yara
            - ml_detection
            - threat_hunting
            - multi_tenant
            - compliance
            - api_access
            - xdr
            - deception
            - forensics
            - soar
        required_plan:
          type: string
          description: |
            この機能を解除する最小プラン。`requiredPlanFor` ヘルパーが返す値で、
            v1.3.3 で MDM 機能は `enterprise` から `starter` に修正済み。
            `lite` は他機能を持たない (Lite が含む機能は 200 を返すため `required_plan` は出現しない)。
          enum: [starter, professional, enterprise]
        upgrade_message:
          type: string
          example: この機能はStarterプラン（¥1,800/端末/月）以上で利用できます

    AgentLimitReachedError:
      type: object
      description: |
        `EnforceAgentLimit` ミドルウェアが返す 402 エラー (`server/internal/middleware/plan_gate.go`)。
        プランの `agent_limit` に達した状態でエージェント追加を試みると返される。
        Lite プランでは Stripe Subscription Quantity が `agent_limit` になる
        (例: 10 EP 契約のテナントは 10 台で上限)。
      required: [error, agent_limit, agents_active, plan, upgrade_message]
      properties:
        error:
          type: string
          enum: [agent_limit_reached]
        agent_limit:
          type: integer
          description: 現プランのエージェント上限 (0=無制限)
          example: 10
        agents_active:
          type: integer
          description: 現在アクティブなエージェント数
          example: 10
        plan:
          type: string
          enum: [free, lite, starter, professional, enterprise]
        upgrade_message:
          type: string
          example: エージェント数がプランの上限に達しています。プランをアップグレードしてください。

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [admin, analyst, viewer]
        is_active:
          type: boolean
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        os_type:
          type: string
          enum: [windows, linux, darwin, unknown]
        os_version:
          type: string
        agent_version:
          type: string
        ip_addresses:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [online, offline, isolated, error, inactive]
          description: >-
            inactive = 30日以上ハートビートが無く DeadAgentCleanup が退役判定した状態。
            エージェントが再びハートビートを送れば online に戻る（isolated だけは保護される）。
        last_seen:
          type: string
          format: date-time
          description: 値が無い場合はレスポンスから省略されます。
        enrolled_at:
          type: string
          format: date-time
        group_id:
          type: string
          format: uuid
          nullable: true
        policy_id:
          type: string
          format: uuid
          nullable: true
        config_version:
          type: integer
        tls_thumbprint:
          type: string
          nullable: true
        isolated_at:
          type: string
          format: date-time
          nullable: true
        isolated_reason:
          type: string
          nullable: true
        isolated_by:
          type: string
          nullable: true
          description: "'ai_agent' | 'auto_rule' | ユーザーID"
        tags:
