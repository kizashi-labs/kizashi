    delete:
      tags: [Incidents]
      summary: インシデント削除
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 削除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /incidents/{id}/alerts:
    get:
      tags: [Incidents]
      summary: インシデント関連アラート一覧
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 関連アラート一覧
    post:
      tags: [Incidents]
      summary: アラートをインシデントに追加
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alert_id]
              properties:
                alert_id:
                  type: string
      responses:
        '200':
          description: 追加成功

  /incidents/{id}/notes:
    get:
      tags: [Incidents]
      summary: インシデントノート一覧
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: ノート一覧
    post:
      tags: [Incidents]
      summary: ノート追加
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: 作成されたノート

  # ── Reports ───────────────────────────────────────────────────
  /reports:
    get:
      tags: [Reports]
      summary: レポート一覧
      responses:
        '200':
          description: レポート一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
    post:
      tags: [Reports]
      summary: レポート生成
      description: PDF/CSVレポートを非同期生成します。重い操作のため1回/分に制限されています。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [alert_summary, incident_summary, compliance, executive]
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                format:
                  type: string
                  enum: [pdf, csv, json]
                  default: pdf
      responses:
        '202':
          description: レポート生成リクエスト受付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '429':
          description: レート制限超過

  /reports/{id}:
    get:
      tags: [Reports]
      summary: レポート詳細
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: レポート詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reports]
      summary: レポート削除
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 削除成功

  /reports/{id}/download:
    get:
      tags: [Reports]
      summary: レポートダウンロード
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: レポートファイル
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  # ── API Keys ──────────────────────────────────────────────────
  /api-keys:
    get:
      tags: [API Keys]
      summary: APIキー一覧
      responses:
        '200':
          description: APIキー一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
    post:
      tags: [API Keys]
      summary: APIキー作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  minLength: 1
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read, write, admin]
                  minItems: 1
                expires_at:
                  type: string
                  format: date-time
                  description: 省略時は無期限
      responses:
        '201':
          description: 作成されたAPIキー（keyフィールドは作成時のみ返されます）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIKey'
                  - type: object
                    properties:
                      key:
                        type: string
                        description: 平文のAPIキー（一度のみ表示）

  /api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: APIキー失効
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 失効成功
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Enrollment ────────────────────────────────────────────────
  /enrollment/request:
    post:
      tags: [Enrollment]
      summary: エージェントエンロールリクエスト
      description: エージェントが初回起動時にエンロールを申請します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, ip_address, os_type, machine_id]
              properties:
                hostname:
                  type: string
                ip_address:
                  type: string
                os_type:
                  type: string
                  enum: [windows, linux, darwin]
                machine_id:
                  type: string
                  description: マシン固有ID (UUID)
                os_version:
                  type: string
                agent_version:
                  type: string
      responses:
        '200':
          description: エンロール承認済み（自動承認の場合）
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  token:
                    type: string
        '202':
          description: エンロール申請受付（手動承認待ち）
        '402':
          description: エージェント数上限に達しています（プランアップグレード必要）
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/enrollment/requests:
    get:
      tags: [Enrollment]
      summary: エンロールリクエスト一覧（admin）
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: エンロールリクエスト一覧

  /admin/enrollment/requests/{id}/approve:
    post:
      tags: [Enrollment]
      summary: エンロールリクエスト承認（admin）
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 承認成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  token:
                    type: string
        '402':
          description: エージェント数上限超過
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/enrollment/requests/{id}/reject:
    post:
      tags: [Enrollment]
      summary: エンロールリクエスト拒否（admin）
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 拒否成功

  # ── Live Response ─────────────────────────────────────────────
  /live-response/sessions:
    get:
      tags: [Live Response]
      summary: ライブレスポンスセッション一覧
      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/LiveResponseSession'
    post:
      tags: [Live Response]
      summary: セッション開始
      description: エージェントへのライブレスポンスセッションを開始します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
      responses:
        '201':
          description: セッション作成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponseSession'

  /live-response/sessions/{sid}/exec:
    post:
      tags: [Live Response]
      summary: コマンド実行
      description: セッション上でコマンドを実行します。2回/秒に制限されています。
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                args:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: コマンド実行結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
                  exit_code:
                    type: integer
        '429':
          $ref: '#/components/responses/RateLimited'

  /live-response/sessions/{sid}:
    delete:
      tags: [Live Response]
      summary: セッション終了
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: セッション終了

  # ── Vulnerabilities ───────────────────────────────────────────
  /vulnerabilities:
    get:
      tags: [Vulnerabilities]
      summary: 脆弱性一覧
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: agent_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 脆弱性一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  vulnerabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vulnerability'
                  total:
                    type: integer

  /vulnerabilities/stats:
    get:
      tags: [Vulnerabilities]
      summary: 脆弱性統計
      responses:
        '200':
          description: 脆弱性統計情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  by_severity:
                    type: object
                    additionalProperties:
                      type: integer
                  by_agent:
                    type: array

  # ── API Documentation ──────────────────────────────────────────
  /docs:
    get:
      tags: [System]
      summary: Swagger UI
      description: OpenAPI仕様のSwagger UIを返します。認証不要。
      security: []
      servers:
        - url: /api/v1
      responses:
        '200':
          description: Swagger UI HTML
          content:
            text/html:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      tags: [System]
      summary: OpenAPI仕様 YAML
      description: OpenAPI 3.0仕様のYAMLファイルを返します。認証不要。
      security: []
      servers:
        - url: /api/v1
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string

  # ── Threat Intelligence Enrichment ────────────────────────────
  /intel/vt/lookup:
    post:
      tags: [Threat Intelligence]
      summary: VirusTotal IOC照会
      description: ファイルハッシュ、IPアドレス、またはドメインをVirusTotalで照会します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: 照会するIOC値 (ハッシュ/IP/ドメイン)
                type:
                  type: string
                  enum: [hash, ip, domain]
                  description: IOCタイプ (省略時は自動検出)
      responses:
        '200':
          description: VirusTotal照会結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  malicious:
                    type: integer
                  suspicious:
                    type: integer
                  total_engines:
                    type: integer
                  reputation:
                    type: integer
                  tags:
                    type: array
                    items:
                      type: string
                  type:
                    type: string
        '503':
          description: VirusTotal APIキーが未設定

