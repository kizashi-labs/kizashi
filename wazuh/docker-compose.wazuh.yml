# Wazuh Single-Node Stack — add to existing EDR Platform deployment
# Usage: docker compose -f docker-compose.yml -f wazuh/docker-compose.wazuh.yml up -d
#
# After startup, configure Wazuh to send alerts to our platform:
#   1. Edit /var/ossec/etc/ossec.conf inside wazuh-manager container
#   2. Add the <integration> block shown below
#   3. Restart Wazuh manager: docker exec wazuh-manager /var/ossec/bin/wazuh-control restart

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.5
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/udp"    # Agent UDP connection
      - "1514:1514/tcp"    # Agent TCP connection
      - "1515:1515"        # Agent enrollment
      - "55000:55000"      # Wazuh Manager REST API
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - wazuh_manager_etc:/var/ossec/etc
      - wazuh_manager_logs:/var/ossec/logs
      - ./wazuh/custom-edr-platform:/var/ossec/integrations/custom-edr-platform:ro
    networks:
      - edr-network
    healthcheck:
      test: ["CMD", "/var/ossec/bin/wazuh-control", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.5
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
    networks:
      - edr-network

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    depends_on:
      - wazuh-indexer
    networks:
      - edr-network

volumes:
  wazuh_manager_data:
  wazuh_manager_etc:
  wazuh_manager_logs:
  wazuh_indexer_data:

# ──────────────────────────────────────────────────────────────
# ossec.conf integration block (add to wazuh-manager container):
#
# <ossec_config>
#   <integration>
#     <name>custom-edr-platform</name>
#     <hook_url>http://server-api:8080/api/v1/ingest/wazuh?token=YOUR_INGEST_TOKEN</hook_url>
#     <level>7</level>
#     <alert_format>json</alert_format>
#   </integration>
# </ossec_config>
#
# Environment variables for server-api:
#   WAZUH_MANAGER_URL=https://wazuh-manager:55000
#   WAZUH_USERNAME=wazuh-wui
#   WAZUH_PASSWORD=MyS3cr37P450r.*-
#   WAZUH_INGEST_TOKEN=your-secret-token
#   WAZUH_SKIP_TLS=true
# ──────────────────────────────────────────────────────────────
