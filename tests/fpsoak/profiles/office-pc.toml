[[network]]
weight   = 5
process  = "OneDrive.exe"
proto    = "tcp"
ports    = [443]
hostname = "corp-my.sharepoint.com"
hosts    = ["13.107.136.9"]
bytes_sent_range = [10000, 20000000]
bytes_recv_range = [5000, 5000000]

# ─── DNS ─────────────────────────────────────────────────────

[[dns]]
weight  = 40
process = "chrome.exe"
queries = [
  "www.google.com", "clients2.google.com", "safebrowsing.googleapis.com",
  "www.bing.com", "cdn.jsdelivr.net", "fonts.gstatic.com",
  "docs.google.com", "www.yahoo.co.jp",
]

[[dns]]
weight  = 20
process = "Teams.exe"
queries = ["teams.microsoft.com", "presence.teams.microsoft.com", "config.teams.microsoft.com"]

[[dns]]
weight  = 20
process = "OUTLOOK.EXE"
queries = ["outlook.office365.com", "autodiscover.corp.example.co.jp", "substrate.office.com"]

[[dns]]
weight  = 20
process = "explorer.exe"
queries = ["fileserver01.corp.example.co.jp", "dc01.corp.example.co.jp", "sccm01.corp.example.co.jp"]

# ─── レジストリ ──────────────────────────────────────────────

[[registry]]
weight  = 40
process = "explorer.exe"
actions = ["modify"]
keys    = [
  'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RecentDocs',
  'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{CEBFF5CD-ACE2-4F4F-9178-9926F41749EA}\Count',
]
values = ["MRUListEx", "{{rand}}"]
data   = ["01000000", "02000000"]

[[registry]]
weight  = 25
process = "chrome.exe"
actions = ["modify"]
keys    = ['HKCU\Software\Google\Chrome\PreferenceMACs\Default']
values  = ["browser.show_home_button", "extensions.settings"]
data    = ["{{rand}}"]

[[registry]]
weight  = 20
process = "OUTLOOK.EXE"
actions = ["create", "modify"]
keys    = ['HKCU\Software\Microsoft\Office\16.0\Outlook\Profiles\Outlook\{{rand}}']
values  = ["01023d00", "001f6620"]
data    = ["{{rand}}"]

# Windows Update / Defender の定義更新に伴う HKLM 書き込み。SYSTEM 権限で
# HKLM 配下を書き換えるという、永続化ルールが最も引っかかりやすい形。
[[registry]]
weight  = 15
process = "MsMpEng.exe"
actions = ["modify"]
keys    = [
  'HKLM\SOFTWARE\Microsoft\Windows Defender\Signature Updates',
  'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update',
]
values  = ["SignatureLastUpdated", "LastWaTime"]
data    = ["{{rand}}"]

# ─── 認証 ────────────────────────────────────────────────────

[[auth]]
weight  = 80
users   = ['CORP\{{user}}']
actions = ["login"]
success = true
methods = ["password", "mfa"]

[[auth]]
weight  = 20
users   = ['CORP\{{user}}']
actions = ["logout"]
success = true
methods = ["password"]

# ─── モジュールロード ────────────────────────────────────────

[[image_loads]]
weight  = 40
process = "chrome.exe"
signed  = true
signer  = "Google LLC"
paths   = [
  'C:\Program Files\Google\Chrome\Application\132.0.6834.83\chrome.dll',
  'C:\Windows\System32\kernel32.dll',
  'C:\Windows\System32\ntdll.dll',
]

[[image_loads]]
weight  = 30
process = "OUTLOOK.EXE"
signed  = true
signer  = "Microsoft Corporation"
paths   = [
  'C:\Program Files\Microsoft Office\root\Office16\OUTLLIB.DLL',
  'C:\Windows\System32\combase.dll',
  'C:\Windows\System32\rpcrt4.dll',
]

[[image_loads]]
weight  = 30
process = "powershell.exe"
signed  = true
signer  = "Microsoft Corporation"
paths   = [
  'C:\Windows\assembly\NativeImages_v4.0.30319_64\System.Management.A#\{{rand}}\System.Management.Automation.ni.dll',
  'C:\Windows\System32\amsi.dll',
]
