bytes_recv_range = [2000, 800000]

[[network]]
weight   = 15
process  = "OUTLOOK.EXE"
proto    = "tcp"
ports    = [443]
hostname = "outlook.office365.com"
hosts    = ["52.96.88.34", "40.100.174.2", "52.98.151.18"]
