# 一般事務PC (Windows) — フリートの大多数を占める「静かな」プロファイル。
#
# 検知器を直接刺激する挙動はほとんど無いが、フリート全体のイベント量の大半を
# 生むのはこの層なので、ここで1件でも誤検知が出れば 1000ホスト/日あたりでは
# 巨大な数字になる。低頻度・高台数側の FP を捕まえるのが役割。

name        = "office-pc"
os          = "windows"
os_version  = "Windows 11 Pro 23H2"
description = "一般事務PC: ブラウザ・Office・Teams・SCCM管理エージェント"
host_prefix = "wks"
fleet_weight = 60
subnet      = "10.20.0.0/16"
users       = ["sato", "suzuki", "takahashi", "tanaka", "ito", "watanabe", "yamamoto", "nakamura"]

[rates]
process    = 120
file       = 900
network    = 700
dns        = 250
registry   = 150
auth       = 4
image_load = 300

# ─── プロセス ────────────────────────────────────────────────

[[processes]]
weight   = 30
name     = "chrome.exe"
path     = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
parent   = "explorer.exe"
user     = 'CORP\{{user}}'
integrity = "Medium"
company  = "Google LLC"
product  = "Google Chrome"
original_file_name = "chrome.exe"
cmdlines = [
  '"C:\Program Files\Google\Chrome\Application\chrome.exe" --type=renderer --field-trial-handle={{randint}} --mojo-platform-channel-handle={{randint}}',
  '"C:\Program Files\Google\Chrome\Application\chrome.exe" --type=gpu-process --gpu-preferences=UAAAA',
  '"C:\Program Files\Google\Chrome\Application\chrome.exe" --type=utility --utility-sub-type=network.mojom.NetworkService',
]

[[processes]]
weight   = 16
name     = "OUTLOOK.EXE"
path     = 'C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE'
parent   = "explorer.exe"
user     = 'CORP\{{user}}'
integrity = "Medium"
company  = "Microsoft Corporation"
product  = "Microsoft Office"
original_file_name = "OUTLOOK.EXE"
cmdlines = ['"C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE"']

[[processes]]
weight   = 12
name     = "Teams.exe"
path     = 'C:\Users\{{user}}\AppData\Local\Microsoft\Teams\current\Teams.exe'
parent   = "explorer.exe"
user     = 'CORP\{{user}}'
integrity = "Medium"
company  = "Microsoft Corporation"
product  = "Microsoft Teams"
original_file_name = "Teams.exe"
cmdlines = ['"Teams.exe" --type=renderer --field-trial-handle={{randint}}']

[[processes]]
weight   = 10
name     = "EXCEL.EXE"
path     = 'C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE'
parent   = "explorer.exe"
user     = 'CORP\{{user}}'
integrity = "Medium"
company  = "Microsoft Corporation"
product  = "Microsoft Office"
original_file_name = "EXCEL.EXE"
cmdlines = [
  '"EXCEL.EXE" /dde',
  '"EXCEL.EXE" "\\fileserver01\share\経理\月次報告_{{date}}.xlsx"',
]

# SCCM/Intune 管理エージェントによる定期実行。正規の管理経路だが
# PowerShell + エンコード済みでないスクリプト実行という「攻撃と紛らわしい」形を取る。
# 事務PC上で最も誤検知を出しやすい挙動なので必ず含める。
[[processes]]
weight   = 8
name     = "powershell.exe"
path     = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
parent   = "CcmExec.exe"
user     = 'NT AUTHORITY\SYSTEM'
integrity = "System"
company  = "Microsoft Corporation"
product  = "Microsoft® Windows® Operating System"
original_file_name = "PowerShell.EXE"
cmdlines = [
  'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Windows\CCM\SystemTemp\inventory-{{rand}}.ps1"',
  'powershell.exe -NoLogo -NonInteractive -Command "Get-WmiObject -Class Win32_QuickFixEngineering"',
  'powershell.exe -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version"',
]

[[processes]]
weight   = 8
name     = "explorer.exe"
path     = 'C:\Windows\explorer.exe'
parent   = "userinit.exe"
user     = 'CORP\{{user}}'
integrity = "Medium"
company  = "Microsoft Corporation"
original_file_name = "EXPLORER.EXE"
cmdlines = ['C:\Windows\Explorer.EXE']

[[processes]]
weight   = 6
name     = "MsMpEng.exe"
path     = 'C:\ProgramData\Microsoft\Windows Defender\Platform\4.18.24010.7-0\MsMpEng.exe'
parent   = "services.exe"
user     = 'NT AUTHORITY\SYSTEM'
integrity = "System"
company  = "Microsoft Corporation"
original_file_name = "MsMpEng.exe"
cmdlines = ['"MsMpEng.exe"']

[[processes]]
weight   = 5
name     = "OneDrive.exe"
path     = 'C:\Users\{{user}}\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
parent   = "explorer.exe"
user     = 'CORP\{{user}}'
integrity = "Medium"
company  = "Microsoft Corporation"
original_file_name = "OneDrive.exe"
cmdlines = ['"OneDrive.exe" /background']

# ─── ファイル ────────────────────────────────────────────────

[[files]]
weight  = 30
process = "chrome.exe"
actions = ["create", "modify", "delete"]
size_range = [1024, 4194304]
paths = [
  'C:\Users\{{user}}\AppData\Local\Google\Chrome\User Data\Default\Cache\Cache_Data\f_{{rand}}',
  'C:\Users\{{user}}\AppData\Local\Google\Chrome\User Data\Default\Code Cache\js\{{rand}}',
  'C:\Users\{{user}}\AppData\Local\Temp\{{rand}}.tmp',
]

[[files]]
weight  = 20
process = "OUTLOOK.EXE"
actions = ["modify"]
size_range = [10485760, 2147483648]
paths = ['C:\Users\{{user}}\AppData\Local\Microsoft\Outlook\{{user}}@corp.example.co.jp.ost']

[[files]]
weight  = 18
process = "OneDrive.exe"
actions = ["create", "modify"]
size_range = [4096, 20971520]
paths = [
  'C:\Users\{{user}}\OneDrive - Corp\ドキュメント\議事録_{{date}}_{{randint}}.docx',
  'C:\Users\{{user}}\OneDrive - Corp\ドキュメント\見積_{{randint}}.xlsx',
]

[[files]]
weight  = 15
process = "EXCEL.EXE"
actions = ["create", "modify", "rename", "delete"]
size_range = [8192, 10485760]
paths = [
  'C:\Users\{{user}}\AppData\Roaming\Microsoft\Excel\~$月次報告_{{date}}.xlsx',
  '\\fileserver01\share\経理\月次報告_{{date}}.xlsx',
]

[[files]]
weight  = 10
process = "MsMpEng.exe"
actions = ["modify"]
size_range = [1024, 262144]
paths = ['C:\ProgramData\Microsoft\Windows Defender\Scans\History\Store\{{rand}}']

# ─── ネットワーク ────────────────────────────────────────────

