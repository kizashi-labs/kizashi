apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: edr-platform
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data
      max_memory_store: 1GB
      max_file_store: 50GB
    }

    cluster {
      name: edr-nats-cluster
      listen: 0.0.0.0:6222
      routes: [
        nats://nats-0.nats-headless:6222
        nats://nats-1.nats-headless:6222
        nats://nats-2.nats-headless:6222
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: edr-platform
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: edr-platform
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
    - name: cluster
      port: 6222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: edr-platform
spec:
  serviceName: nats-headless
  replicas: 3
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - containerPort: 4222
            - containerPort: 6222
            - containerPort: 8222
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
