# Apply with: kubectl create secret generic edr-platform-secrets -n edr-platform \
#   --from-literal=DATABASE_URL='postgres://edr:PASSWORD@postgres:5432/edrplatform' \
#   --from-literal=JWT_SECRET='your-secret-here' \
#   --from-literal=ADMIN_PASSWORD='change-in-production'
apiVersion: v1
kind: Secret
metadata:
  name: edr-platform-secrets
  namespace: edr-platform
type: Opaque
stringData:
  DATABASE_URL: "postgres://edr:CHANGE_ME@postgres:5432/edrplatform"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
