{{- if .Values.api.envFromSecret }}
# NOTE: In production, manage this secret externally (e.g. with Sealed Secrets or
# External Secrets Operator) and set api.envFromSecret values to "".
# This template creates a placeholder secret only when values are provided.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edr-platform.fullname" . }}-secret
  labels:
    {{- include "edr-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := .Values.api.envFromSecret }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
