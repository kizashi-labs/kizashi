{{- if .Values.geoipPVC.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edr-platform.fullname" . }}-geoip
  labels:
    {{- include "edr-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.geoipPVC.accessMode }}
  {{- if .Values.geoipPVC.storageClass }}
  storageClassName: {{ .Values.geoipPVC.storageClass }}
  {{- else if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.geoipPVC.size }}
{{- end }}
