# ── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""

# ── API Server ─────────────────────────────────────────────────────────────────
api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/edr-platform/api
    tag: ""        # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    API_PORT: "8080"
    LOG_LEVEL: "info"
    NATS_URL: ""     # auto-set from nats subchart if enabled
    REDIS_URL: ""    # auto-set from redis subchart if enabled

  envFromSecret:
    JWT_SECRET: ""
    DATABASE_URL: ""
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_USER: ""
    SMTP_PASS: ""
    SMTP_FROM: ""
    ANTHROPIC_API_KEY: ""
    GEOIP_DB_PATH: "/data/GeoLite2-City.mmdb"

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Frontend ───────────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/edr-platform/frontend
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    NEXT_PUBLIC_API_URL: "/api/v1"
    NODE_ENV: "production"

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: edr.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: api
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    - secretName: edr-tls
      hosts:
        - edr.example.com

# ── PostgreSQL (bitnami subchart) ──────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    database: edrplatform
    username: edr
    existingSecret: edr-postgres-secret
    secretKeys:
      userPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    extendedConfiguration: |
      shared_preload_libraries = 'timescaledb'
      max_connections = 200
      shared_buffers = 256MB
      work_mem = 4MB
  image:
    repository: timescale/timescaledb
    tag: latest-pg16

# ── Redis (bitnami subchart) ───────────────────────────────────────────────────
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: edr-redis-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  replica:
    replicaCount: 1

# ── NATS (official subchart) ───────────────────────────────────────────────────
nats:
  enabled: true
  nats:
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 1Gi
      fileStorage:
        enabled: true
        size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ── Persistence (for GeoIP DB) ────────────────────────────────────────────────
geoipPVC:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

# ── ServiceAccount ─────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ── Pod Disruption Budgets ─────────────────────────────────────────────────────
podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 1
  frontend:
    enabled: true
    minAvailable: 1

# ── Network Policy ─────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false

# ── Monitoring ─────────────────────────────────────────────────────────────────
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: monitoring
    interval: 30s
