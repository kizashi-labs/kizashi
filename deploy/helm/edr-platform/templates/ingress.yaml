{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "edr-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edr-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* API traffic → server */}}
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "edr-platform.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
          {{- /* WebSocket / SSE endpoints used by the frontend */}}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "edr-platform.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
          {{- /* Everything else → frontend */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "edr-platform.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
