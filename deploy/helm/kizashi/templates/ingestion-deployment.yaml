apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kizashi.fullname" . }}-ingestion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kizashi.componentLabels" (dict "root" . "component" "ingestion") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestion.replicaCount }}
  selector:
    matchLabels:
      {{- include "kizashi.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "kizashi.componentLabels" (dict "root" . "component" "ingestion") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.ingestion.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kizashi.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "kizashi.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.ingestion.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingestion
          image: {{ include "kizashi.image" (dict "root" . "image" .Values.ingestion.image) }}
          imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
          {{- with .Values.ingestion.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.ingestion.ports.grpc }}
              protocol: TCP
          env:
            # ---- Database ----
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kizashi.dbSecretName" . }}
                  key: {{ include "kizashi.dbSecretKey" . }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.global.postgresql.user }}:$(DB_PASSWORD)@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/{{ .Values.global.postgresql.database }}?sslmode=require"
            # ---- NATS ----
            - name: NATS_URL
              value: {{ include "kizashi.natsURL" . | quote }}
            # ---- Ports ----
            - name: GRPC_PORT
              value: {{ .Values.ingestion.ports.grpc | quote }}
            # ---- App config ----
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            {{- with .Values.ingestion.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.ingestion.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.ingestion.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.ingestion.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestion.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestion.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "kizashi.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 14 }}
