{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kizashi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.certManager }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManagerIssuer | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # --- API routes ---
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "kizashi.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.httpPort }}
          # --- WebSocket / gRPC-Web upgrade path (if exposed via HTTP) ---
          - path: /grpc/
            pathType: Prefix
            backend:
              service:
                name: {{ include "kizashi.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.grpcPort }}
          # --- Frontend (catch-all; must be last) ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kizashi.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.httpPort }}
{{- end }}
