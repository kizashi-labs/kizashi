{{- if .Values.createSecrets }}
{{- $dbPassword := .Values.global.postgresql.password | default (randAlphaNum 32) }}
{{- $jwtSecret := .Values.global.jwt.secret | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kizashi.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from overwriting passwords on upgrade if they were auto-generated.
    # Use "helm upgrade --set global.postgresql.password=..." to rotate.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgresql-password: {{ $dbPassword | b64enc | quote }}
  jwt-secret: {{ $jwtSecret | b64enc | quote }}
{{- end }}
