[databases]
; Route "edrplatform" → TimescaleDB container
edrplatform = host=postgres port=5432 dbname=edrplatform

[pgbouncer]
; Listen on all interfaces inside the container
listen_addr     = 0.0.0.0
listen_port     = 5432

; Session pooling.
;
; **このアプリは接続ごとに SET を使います。** テナントの絞り込みは
; PostgreSQL の RLS が行い、その入力は接続のセッション変数
; `app.tenant_id` 1つです（`server/internal/store/postgres.go` の
; `prepareConnForTenant` が `set_config(…, false)` で設定します）。
;
; ここが `transaction` だと、その設定は次のクエリまで残りません。
; `server_reset_query = DISCARD ALL` も明示的に消します。**RLS の
; ポリシーは `app.tenant_id` が空のとき全件を通す**ので（migration
; 027 / 324）、絞り込みが事実上外れます。
;
; 実測 (2026-08-12)。PostgreSQL 16 + pgbouncer 1.22 をこの設定で立て、
; 本番と同じプール（PrepareConn = prepareConnForTenant）でテナント A の
; 要求を 200 回:
;
;   直接つないだとき              見えた行 1 が 200 回
;   pgbouncer 経由（transaction）   見えた行 2 が 199 回（＝両テナント）
;
; もう1つ。pgx の既定（拡張プロトコル＋文キャッシュ）は transaction
; モードにそもそも繋がりません（42P05 prepared statement already
; exists）。**繋がらないことで漏れていなかっただけ**です。
;
; この行は `server/internal/store/session_state_vs_pooler_test.go` が
; 見張っています。transaction に戻すには、先に絞り込みをセッション
; 状態から外す必要があります（`docs/判断待ちの一覧.md`）。
pool_mode       = session

; Maximum server-side PostgreSQL connections per database
default_pool_size    = 25

; Total connection slots (clients can queue beyond this)
max_client_conn      = 500

; Reserve connections for admin/monitoring
reserve_pool_size    = 5
reserve_pool_timeout = 3

; Authentication
auth_type       = md5
auth_file       = /etc/pgbouncer/userlist.txt

; Administrative interface
admin_users     = pgbouncer_admin
stats_users     = pgbouncer_stats

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors  = 1

; Timeouts
server_idle_timeout  = 600
client_idle_timeout  = 0
server_connect_timeout = 15
query_timeout        = 0

; Connection cleanup
server_reset_query   = DISCARD ALL
server_check_query   = SELECT 1
server_check_delay   = 30
