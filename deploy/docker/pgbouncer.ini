[databases]
; Route "edrplatform" → TimescaleDB container
edrplatform = host=postgres port=5432 dbname=edrplatform

[pgbouncer]
; Listen on all interfaces inside the container
listen_addr     = 0.0.0.0
listen_port     = 5432

; Transaction pooling — best for stateless microservices.
; (Session pooling required only if SET/PREPARE is used per-connection.)
pool_mode       = transaction

; Maximum server-side PostgreSQL connections per database
default_pool_size    = 25

; Total connection slots (clients can queue beyond this)
max_client_conn      = 500

; Reserve connections for admin/monitoring
reserve_pool_size    = 5
reserve_pool_timeout = 3

; Authentication
auth_type       = md5
auth_file       = /etc/pgbouncer/userlist.txt

; Administrative interface
admin_users     = pgbouncer_admin
stats_users     = pgbouncer_stats

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors  = 1

; Timeouts
server_idle_timeout  = 600
client_idle_timeout  = 0
server_connect_timeout = 15
query_timeout        = 0

; Connection cleanup
server_reset_query   = DISCARD ALL
server_check_query   = SELECT 1
server_check_delay   = 30
