global
    maxconn     50000
    log         stdout format raw local0 info
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect  5s
    timeout client   30s
    timeout server   30s
    # gRPC keepalive — allow long-lived streams
    timeout tunnel   1h

# ─── gRPC Ingestion Load Balancer ─────────────────────────────
# Agents connect to :9090; HAProxy distributes across ingest instances.
# Uses leastconn so busy ingest servers receive fewer new streams.

frontend agents_grpc
    bind *:9090
    mode tcp
    default_backend ingest_pool

backend ingest_pool
    mode        tcp
    balance     leastconn
    option      tcp-check

    # Health check: TCP connect
    timeout check 5s

    server ingest-1 server-ingest-1:9090 check inter 10s rise 2 fall 3
    server ingest-2 server-ingest-2:9090 check inter 10s rise 2 fall 3
    server ingest-3 server-ingest-3:9090 check inter 10s rise 2 fall 3

# ─── Stats endpoint ───────────────────────────────────────────
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
