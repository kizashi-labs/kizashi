# NATS Cluster Node 2
port: 4222
http_port: 8222
server_name: nats-2

jetstream {
  store_dir: /data
  max_memory_store: 1GB
  max_file_store: 50GB
}

cluster {
  name: edr-cluster
  port: 6222
  routes: [
    nats-route://nats-1:6222
    nats-route://nats-3:6222
  ]
}

max_connections: 10000
max_payload: 8MB
write_deadline: "10s"
