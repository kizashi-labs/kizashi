[global]
# Ofelia ジョブスケジューラ設定
# ドキュメント: https://github.com/mcuadros/ofelia

# ---------------------------------------------------------------------------
# 毎日午前 2 時にバックアップを実行 (edr-backup コンテナを起動)
# ---------------------------------------------------------------------------
[job-run "edr-daily-backup"]
schedule   = 0 2 * * *
container  = edr-backup
no-overlap = true

# ---------------------------------------------------------------------------
# スケジュールのプリセット例:
#   @hourly   = 0 * * * *
#   @daily    = 0 0 * * *
#   @weekly   = 0 0 * * 0
#   @monthly  = 0 0 1 * *
#   @yearly   = 0 0 1 1 *
# ---------------------------------------------------------------------------
