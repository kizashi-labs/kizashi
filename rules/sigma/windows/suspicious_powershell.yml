title: 疑わしいPowerShell実行の検知
id: a12b3c4d-5e6f-7890-abcd-ef1234567890
status: stable
description: |
  PowerShellのエンコードされたコマンド実行や、ダウンロード・実行パターンを検知します。
  これらはマルウェアのドロッパー、リモートアクセスツール、侵害後の活動でよく使用されます。
author: EDR Platform
date: 2024/01/01
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_encoded:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  selection_download:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'WebClient'
      - 'Invoke-WebRequest'
      - 'iwr '
      - 'curl '
      - 'wget '
  selection_bypass:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-ExecutionPolicy Bypass'
      - '-ep bypass'
      - '-noprofile'
      - '-windowstyle hidden'
      - '-NonInteractive'
  selection_suspicious_parents:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\outlook.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: >
    selection_encoded
    or selection_download
    or (selection_bypass and selection_suspicious_parents)
falsepositives:
  - システム管理スクリプト
  - 正規のソフトウェアインストーラー
level: high
severity: 7
auto_isolate: false
auto_kill: false
